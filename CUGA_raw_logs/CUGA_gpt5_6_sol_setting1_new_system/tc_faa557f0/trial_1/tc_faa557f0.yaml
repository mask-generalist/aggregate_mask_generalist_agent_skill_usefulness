id: tc_faa557f0
description: You are Rachel Kim (E001), VP of Sales at Meridian Analytics. You want
  to verify the Q3 revenue figure in docs/q3_report.md against the detailed deal data
  in data/sales_q3.csv and then correct the report if needed. The report currently
  states $1,040,000 in new contract value, and you need the agent to read the files
  and update that exact figure to match the won deals listed for James Okafor and
  Sofia Delgado.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Rachel Kim (E001), VP of Sales at Meridian Analytics. You
      want to verify the Q3 revenue figure in docs/q3_report.md against the detailed
      deal data in data/sales_q3.csv and then correct the report if needed. The report
      currently states $1,040,000 in new contract value, and you need the agent to
      read the files and update that exact figure to match the won deals listed for
      James Okafor and Sofia Delgado. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent reads docs/q3_report.md and identifies that the executive summary
      currently shows $1,040,000.
  - check: The agent determines the correct total from data/sales_q3.csv should be
      $367,500 based on the won deals D001, D002, D003, D005, and D006 belonging to
      James Okafor and Sofia Delgado.
  - check: The agent updates docs/q3_report.md by replacing $1,040,000 with $367,500.
  - check: The agent reports back to Rachel Kim (E001) that the Q3 report was corrected
      using the sales data associated with James Okafor and Sofia Delgado.
  capability_validations:
    expected_capabilities:
    - name: read_file
      description: Read file contents from workspace, optionally filtering by line
        range or regex pattern.
      output:
        check: '{"content": "# Meridian Analytics \u2014 Q3 2026 Business Report\n\n**Period:**
          July 1 \u2013 September 7, 2026\n**Prepared by:** Rachel Kim, VP of Sales
          | Claire Fontaine, CFO\n**Distribution:** Executive Team\n\n---\n\n## Executive
          Summary\n\nQ3 2026 marks another strong quarter for Meridian Analytics.
          Across our 15-person team we closed 14 deals out of 22 opportunities, generating
          **$1,040,000** in new contract value."}'
    - name: edit_file
      description: Apply exact-text edits to a file using oldText/newText replacement
        pairs.
      output:
        check: '{"success": true}'
