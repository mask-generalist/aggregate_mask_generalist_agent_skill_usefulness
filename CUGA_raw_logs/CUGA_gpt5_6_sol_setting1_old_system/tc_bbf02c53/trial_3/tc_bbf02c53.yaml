id: tc_bbf02c53
description: You are alice (alice@example.com). You want to extract text from the
  first page of a PDF, put the result into a new Excel file, and save it for later
  review. You already use Excel in this environment with data/order_summary.xlsx,
  and you want the OCR output captured into a spreadsheet cell after processing the
  PDF.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to extract text from
      the first page of a PDF, put the result into a new Excel file, and save it for
      later review. You already use Excel in this environment with data/order_summary.xlsx,
      and you want the OCR output captured into a spreadsheet cell after processing
      the PDF. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent acts on behalf of alice using the context of alice@example.com.
  - check: The agent references the existing Excel file path data/order_summary.xlsx
      as part of completing the workflow.
  - check: The agent reports OCR text consistent with the spreadsheet header values
      including Order ID, Customer, Date, Status, Items, and Total Paid.
  - check: The agent writes the value Order ID into row 1, column 1 of data/order_summary.xlsx.
  capability_validations:
    expected_capabilities:
    - name: convert_to_image
      description: Render the first page of a PDF to an image file.
      output:
        check: '{"status": "success"}'
    - name: recognize_file
      description: Extract text from an image via OCR.
      output:
        check: '{"text": "Order ID Customer Date Status Items Total Paid"}'
    - name: create_new_file
      description: Create a new empty Excel file.
      output:
        check: '{"status": "success"}'
    - name: set_cell
      description: Write a value to a specific cell in an Excel file using 1-based
        row/col indices.
      output:
        check: '{"status": "success"}'
