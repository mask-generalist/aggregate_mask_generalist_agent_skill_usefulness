id: tc_2fef721b
description: You are alice (alice@example.com). You want to read the report in docs/customer_report.docx
  and email its contents to bob@example.com. The file contains the Customer Activity
  Report for Maya Chen, including order ORD-6C71B1 for $79.00 and order ORD-5B048F
  for $108.00, so you want those details included in the message.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to read the report in
      docs/customer_report.docx and email its contents to bob@example.com. The file
      contains the Customer Activity Report for Maya Chen, including order ORD-6C71B1
      for $79.00 and order ORD-5B048F for $108.00, so you want those details included
      in the message.
      Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent reads docs/customer_report.docx before composing the email.
  - check: The agent includes Maya Chen in the email content sent from alice to bob@example.com.
  - check: The agent includes order ORD-6C71B1 with total $79.00 in the message.
  - check: The agent includes order ORD-5B048F with total $108.00 in the message.
  capability_validations:
    expected_capabilities:
    - name: read_file
      description: Read file contents from workspace, optionally filtering by line
        range or regex pattern.
      output:
        check: '{"content": "Customer Activity Report\nMaya Chen\nOrder ORD-6C71B1
          | 2026-09-02 | cancelled | Items: Anker Portable Bluetooth Speaker | Total:
          $79.00\nOrder ORD-5B048F | 2026-09-02 | confirmed | Items: Anker Portable
          Bluetooth Speaker, LogiTech Wireless Mouse M310 | Total: $108.00"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "sent"}'
