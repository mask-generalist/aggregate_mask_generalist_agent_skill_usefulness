id: tc_6dc62f04
description: 'You are olivia.hr.manager (olivia.hr.manager@company.com). You want
  to review your inbox for the onboarding equipment request, read the follow-up email
  to priya.it.lead, create a calendar event to track the setup, and then send a confirmation
  email to ethan.it.specialist. In your inbox, there is an email with subject "High
  Priority: Onboarding Equipment Setup Needed - Follow-Up," and existing calendar
  context includes "New Hire Readiness Check (Virtual) — laptop, VPN/email, day-one
  setup" on 2026-09-08T10:00:00.'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are olivia.hr.manager (olivia.hr.manager@company.com). You
      want to review your inbox for the onboarding equipment request, read the follow-up
      email to priya.it.lead, create a calendar event to track the setup, and then
      send a confirmation email to ethan.it.specialist. In your inbox, there is an
      email with subject "High Priority: Onboarding Equipment Setup Needed - Follow-Up,"
      and existing calendar context includes "New Hire Readiness Check (Virtual) —
      laptop, VPN/email, day-one setup" on 2026-09-08T10:00:00. Approve code or command from the agent if prompted.'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: 'The agent lists olivia.hr.manager''s inbox and identifies both email IDs,
      including "olivia.hr.manager/High Priority: Onboarding Equipment Setup Needed
      - Follow-Up.eml".'
  - check: 'The agent reads "olivia.hr.manager/High Priority: Onboarding Equipment
      Setup Needed - Follow-Up.eml" and correctly reports that it is from olivia.hr.manager@company.com
      to priya.it.lead@company.com.'
  - check: The agent creates a calendar event for olivia.hr.manager with summary "New
      Hire Readiness Check (Virtual) — laptop, VPN/email, day-one setup" at 2026-09-08T10:00:00
      to 2026-09-08T10:30:00.
  - check: 'The agent sends an email from olivia.hr.manager to ethan.it.specialist@company.com
      with subject "High Priority: Onboarding Equipment Setup Needed".'
  capability_validations:
    expected_capabilities:
    - name: list_emails
      description: List inbox emails for a user.
      output:
        check: '{"emails": ["olivia.hr.manager/High Priority: Onboarding Equipment
          Setup Needed.eml", "olivia.hr.manager/High Priority: Onboarding Equipment
          Setup Needed - Follow-Up.eml"]}'
    - name: read_email
      description: Read a specific email by its email_id (filename, e.g. Hello.eml).
      output:
        check: '{"from": "olivia.hr.manager@company.com", "to": "priya.it.lead@company.com",
          "subject": "High Priority: Onboarding Equipment Setup Needed - Follow-Up",
          "body": "Hello Priya,\n\nFollowing up on a high-priority onboarding request
          for a newly onboarded contractor starting soon. The contractor needs a standard
          Windows laptop, VPN access, and email configured before start of business
          on the next business day.\n\nPlease confirm that the setup ticket is being
          tracked.\n\nBest,\nOlivia\n\nTone: professional and concise"}'
    - name: create_event
      description: Add a calendar event for a user.
      output:
        check: '{"status": "success"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "success"}'
