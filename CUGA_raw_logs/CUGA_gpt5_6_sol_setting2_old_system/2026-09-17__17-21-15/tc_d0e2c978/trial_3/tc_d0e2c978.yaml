id: tc_d0e2c978
description: You are alice (alice@example.com). You want to extract text from the
  PDF handbook.pdf, OCR the first page image, create a new Excel file, and write the
  extracted result into it. Use the OfficeBench file tools in sequence and complete
  the task in the alice context.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to extract text from
      the PDF handbook.pdf, OCR the first page image, create a new Excel file, and
      write the extracted result into it. Use the OfficeBench file tools in sequence
      and complete the task in the alice context. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent should act on behalf of alice using the username value alice.
  - check: The agent should reference alice@example.com when describing the user context
      for the task.
  - check: The agent should read handbook.pdf before proceeding to later steps for
      alice.
  - check: The agent should create an Excel file and write a value into row 1, col
      1 for alice.
  - check: The agent should report that the workflow for alice completed successfully.
  capability_validations:
    expected_capabilities:
    - name: pdf_read_file
      description: Extract text from all pages of a PDF file.
      output:
        check: '{"text": "Extracted text from handbook.pdf for alice"}'
    - name: convert_to_image
      description: Render the first page of a PDF to an image file.
      output:
        check: '{"status": "success"}'
    - name: recognize_file
      description: Extract text from an image via OCR.
      output:
        check: '{"text": "OCR text extracted for alice from handbook.pdf image"}'
    - name: create_new_file
      description: Create a new empty Excel file.
      output:
        check: '{"status": "success"}'
    - name: set_cell
      description: Write a value to a specific cell in an Excel file using 1-based
        row/col indices.
      output:
        check: '{"status": "success"}'
