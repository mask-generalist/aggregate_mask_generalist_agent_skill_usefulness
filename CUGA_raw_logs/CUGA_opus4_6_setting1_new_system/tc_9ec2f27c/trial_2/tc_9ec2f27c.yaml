  laptop, VPN access, and email configured before start of business on the next business
  day, so you need the agent to first generate the wording and then send it.'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are olivia.hr.manager (olivia.hr.manager@company.com). You
      want to draft a professional and concise follow-up email about the existing
      request "High Priority: Onboarding Equipment Setup Needed" and send it to ethan.it.specialist
      at ethan.it.specialist@company.com. The original email asks for a standard Windows
      laptop, VPN access, and email configured before start of business on the next
      business day, so you need the agent to first generate the wording and then send
      it. Approve code or command from the agent if prompted.'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent generates draft email text for olivia.hr.manager@company.com
      addressed to ethan.it.specialist@company.com before sending the message.
  - check: 'The agent''s drafted content references the subject "High Priority: Onboarding
      Equipment Setup Needed" and includes the requests for a standard Windows laptop,
      VPN access, and email configuration.'
  - check: The agent sends the email from username olivia.hr.manager to ethan.it.specialist@company.com.
  - check: The agent uses a professional and concise tone consistent with Olivia's
      existing email to Ethan.
  capability_validations:
    expected_capabilities:
    - name: complete_text
      description: Send a prompt to the configured LLM and return the response.
      output:
        check: '{"response": "Hello Ethan,\n\nFollowing up on the request regarding
          onboarding equipment setup for a newly onboarded contractor who is starting
          soon. Please arrange a standard Windows laptop, VPN access, and email configuration
          before start of business on the next business day.\n\nPlease prioritize
          this request.\n\nBest,\nOlivia"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "sent"}'
