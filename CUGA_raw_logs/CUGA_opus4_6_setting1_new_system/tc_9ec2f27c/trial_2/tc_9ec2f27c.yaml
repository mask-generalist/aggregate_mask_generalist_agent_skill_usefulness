id: tc_9ec2f27c
description: 'You are olivia.hr.manager (olivia.hr.manager@company.com). You want
  to draft a professional and concise follow-up email about the existing request "High
  Priority: Onboarding Equipment Setup Needed" and send it to ethan.it.specialist
