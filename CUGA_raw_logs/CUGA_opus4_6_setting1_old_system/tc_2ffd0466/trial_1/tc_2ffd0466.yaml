id: tc_2ffd0466
description: You are Nora Delgado (user_ea286107). You want to review the change policy
  for your confirmed booking B75309, check the current details of the booking and
  the status of flight FL398507, and then preview a same-flight booking update before
  confirming it. Your booking is an economy one-way trip from LAX to LAS on 2026-09-16
  with price_paid 129, and you want to make sure the flight is still scheduled before
  making the update.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Nora Delgado (user_ea286107). You want to review the change
      policy for your confirmed booking B75309, check the current details of the booking
      and the status of flight FL398507, and then preview a same-flight booking update
      before confirming it. Your booking is an economy one-way trip from LAX to LAS
      on 2026-09-16 with price_paid 129, and you want to make sure the flight is still
      scheduled before making the update. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-travel
  agent_response_validations:
  - check: The agent states the change policy and specifically mentions that for booking
      B75309, changes should be previewed with confirm=false before confirmation.
  - check: The agent reports that booking B75309 belongs to user_ea286107, is confirmed,
      is in economy, and has price_paid 129.
  - check: The agent states that flight FL398507 is currently scheduled with 0 delay_minutes
      before proceeding with the booking update flow.
  - check: The agent performs a preview update for booking B75309 with confirm set
      to false and communicates the previewed amounts change_fee 0, fare_difference
      0, and new_total 129.
  capability_validations:
    expected_capabilities:
    - name: get_policies
      description: 'Look up travel policies for a specific topic. Topics: cancel,
        change, baggage, delay_compensation, loyalty, upgrade, hotel_cancel, car_rental_cancel.'
      output:
        check: '{"topic": "change", "rules": "For flight changes, pass confirm=false
          first to preview fees, then confirm=true to execute."}'
    - name: update_booking
      description: Update an existing booking. Only pass fields to change for same-flight
        edits. For flight changes, pass confirm=false first to preview fees, then
        confirm=true to execute.
      output:
        check: '{"booking_id": "B75309", "status": "confirmed", "change_fee": 0, "fare_difference":
          0, "new_total": 129}'
    - name: get_booking
      description: Retrieve the details of an existing booking by its booking ID.
      output:
        check: '{"booking_id": "B75309", "user_id": "user_ea286107", "flight_id":
          "FL398507", "cabin_class": "economy", "seat_type": null, "status": "confirmed",
          "price_paid": 129}'
    - name: get_flight_status
      description: Check the current status of a flight (scheduled, delayed, or cancelled).
      output:
        check: '{"flight_id": "FL398507", "status": "scheduled", "delay_minutes":
          0}'
