id: tc_c1300b53
description: You are Rachel Kim (E001), VP of Sales at Meridian Analytics. You want
  to read the current Q3 sales report and save a short extracted summary to a new
  workspace file for follow-up with James Okafor and Sofia Delgado. The existing report
  states Q3 2026 closed 14 deals out of 22 opportunities for $1,040,000 in new contract
  value, and notes that the South region led at $468,000.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Rachel Kim (E001), VP of Sales at Meridian Analytics. You
      want to read the current Q3 sales report and save a short extracted summary
      to a new workspace file for follow-up with James Okafor and Sofia Delgado. The
      existing report states Q3 2026 closed 14 deals out of 22 opportunities for $1,040,000
      in new contract value, and notes that the South region led at $468,000. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent reads from docs/q3_report.md and uses the Q3 2026 figures $1,040,000
      and 14 deals in its response or written content.
  - check: The agent writes a file containing Rachel Kim (E001) and identifies her
      as VP of Sales.
  - check: The agent includes the statement that the South region led at $468,000
      in the saved summary.
  - check: The agent preserves the top-deal detail Sofia Delgado $198,000 (D019, Sep
      5) in the written output.
  capability_validations:
    expected_capabilities:
    - name: read_file
      description: Read file contents from workspace, optionally filtering by line
        range or regex pattern.
      output:
        check: '{"content": "# Meridian Analytics - Q3 2026 Business Report\n\nPeriod:
          July 1 - September 7, 2026\nPrepared by: Rachel Kim, VP of Sales | Claire
          Fontaine, CFO\n\n## Executive Summary\nQ3 2026: closed 14 deals out of 22
          opportunities, generating $1,040,000 in new contract value. South region
          led at $468,000. Win rate 63.6%. Top deal: Sofia Delgado $198,000 (D019,
          Sep 5)."}'
    - name: write_file
      description: Write content to a file, creating it if it does not exist or overwriting
        if it does.
      output:
        check: '{"success": true}'
