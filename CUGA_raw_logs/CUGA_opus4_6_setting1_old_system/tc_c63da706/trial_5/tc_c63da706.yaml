id: tc_c63da706
description: You are alice (alice@example.com). You want to extract text from an image
  and place it into a new Excel file you own. Use the OCR result from invoice.png
  and write it into a spreadsheet for alice@example.com.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to extract text from
      an image and place it into a new Excel file you own. Use the OCR result from
      invoice.png and write it into a spreadsheet for alice@example.com. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent performs OCR on /workspace/skills/OfficeBench/testbed/images/invoice.png
      for user alice.
  - check: The agent creates a new Excel file for alice at /workspace/skills/OfficeBench/testbed/data/alice.xlsx.
  - check: 'The agent writes the OCR text ''Invoice #1042\nDate: 2026-08-01\nTotal:
      $2500.00'' into row 1, column 1 of /workspace/skills/OfficeBench/testbed/data/alice.xlsx.'
  - check: The agent confirms completion for alice, referencing that the invoice text
      has been written to the spreadsheet.
  capability_validations:
    expected_capabilities:
    - name: recognize_file
      description: Extract text from an image via OCR.
      output:
        check: '{"text": "Invoice #1042\nDate: 2026-08-01\nTotal: $2500.00"}'
    - name: create_new_file
      description: Create a new empty Excel file.
      output:
        check: '{"status": "success"}'
    - name: set_cell
      description: Write a value to a specific cell in an Excel file using 1-based
        row/col indices.
      output:
        check: '{"status": "success"}'
