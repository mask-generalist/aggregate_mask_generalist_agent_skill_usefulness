id: tc_f6cea197
description: You are James Okafor. You want to search for a direct flight and save
  the results to a workspace file. You are an Account Executive mentioned in docs/meeting_notes_2026_09.txt
  and also appear in data/sales_q3.csv on deals D001, D003, and D006. Save the flight
  search results to data/sales_q3.csv.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are James Okafor. You want to search for a direct flight and
      save the results to a workspace file. You are an Account Executive mentioned
      in docs/meeting_notes_2026_09.txt and also appear in data/sales_q3.csv on deals
      D001, D003, and D006. Save the flight search results to data/sales_q3.csv. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: tau2Airline
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent searches for a direct flight using the date 2026-07-10 and then
      writes the resulting flights list to data/sales_q3.csv.
  - check: The agent mentions James Okafor in its response as the user context before
      or after saving the results.
  - check: The agent references at least one of James Okafor's deal IDs, such as D001,
      D003, or D006, while confirming the task.
  - check: The agent confirms that the file write to data/sales_q3.csv succeeded after
      saving the flight search results.
  capability_validations:
    expected_capabilities:
    - name: search_direct_flight
      description: Search for direct flights between two airports on a given date.
      output:
        check: '{"flights": []}'
    - name: write_file
      description: Write content to a file, creating it if it does not exist or overwriting
        if it does.
      output:
        check: '{"success": true}'
