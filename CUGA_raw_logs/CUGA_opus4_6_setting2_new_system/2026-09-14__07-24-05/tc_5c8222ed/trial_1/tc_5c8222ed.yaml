id: tc_5c8222ed
description: You are Rachel Kim (E001), VP of Sales at Meridian Analytics. You want
  to read the Q3 sales data from data/sales_q3.csv and create a new summary file in
  the workspace highlighting James Okafor's won deals. Use the real Q3 records for
  James Okafor, including D001, D003, and D006, and write the summary into docs/q3_report.md.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Rachel Kim (E001), VP of Sales at Meridian Analytics. You
      want to read the Q3 sales data from data/sales_q3.csv and create a new summary
      file in the workspace highlighting James Okafor's won deals. Use the real Q3
      records for James Okafor, including D001, D003, and D006, and write the summary
      into docs/q3_report.md. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent reads data/sales_q3.csv and identifies the James Okafor records
      D001, D003, and D006.
  - check: The agent uses the exact amounts 87500, 43000, and 120000 from the sales
      file in the written summary.
  - check: The agent writes updated content to docs/q3_report.md that references James
      Okafor and the won status for D001, D003, and D006.
  - check: The agent confirms completion in a way that is consistent with successfully
      writing docs/q3_report.md for Rachel Kim (E001).
  capability_validations:
    expected_capabilities:
    - name: read_file
      description: Read file contents from workspace, optionally filtering by line
        range or regex pattern.
      output:
        check: '{"content": "D001,James Okafor,North,Meridian Insights Pro,87500,2026-07-05,won\nD003,James
          Okafor,East,Meridian DataBridge,43000,2026-07-12,won\nD006,James Okafor,South,Meridian
          Insights Pro,120000,2026-07-22,won"}'
    - name: write_file
      description: Write content to a file, creating it if it does not exist or overwriting
        if it does.
      output:
        check: '{"success": true}'
