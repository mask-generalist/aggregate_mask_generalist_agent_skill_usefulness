id: tc_a40a0754
description: 'You are Olivia HR Manager (username: olivia.hr.manager, email: olivia.hr.manager@company.com).
  You want to find the Word document in docs, review the customer activity report
  for Maya Chen, convert that report to PDF, and email it to Ethan IT Specialist at
  ethan.it.specialist@company.com. The report includes orders such as ORD-6C71B1 for
  $79.00 and ORD-5B048F for $108.00, so you want to confirm the document contents
  before sending the PDF.'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Olivia HR Manager (username: olivia.hr.manager, email:
      olivia.hr.manager@company.com). You want to find the Word document in docs,
      review the customer activity report for Maya Chen, convert that report to PDF,
      and email it to Ethan IT Specialist at ethan.it.specialist@company.com. The
      report includes orders such as ORD-6C71B1 for $79.00 and ORD-5B048F for $108.00,
      so you want to confirm the document contents before sending the PDF.
      Approve code or command from the agent if prompted.'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent searches docs/*.docx and identifies both docs/customer_report.docx
      and docs/travel_summary.docx.
  - check: The agent reads docs/customer_report.docx and references Maya Chen along
      with Order ORD-5B048F for $108.00.
  - check: The agent converts docs/customer_report.docx into docs/customer_report.pdf
      before sending any email.
  - check: 'The agent sends an email from olivia.hr.manager@company.com to ethan.it.specialist@company.com
      using the subject High Priority: Onboarding Equipment Setup Needed.'
  - check: The agent's final response confirms that the sent material concerns the
      Customer Activity Report and mentions at least one specific order such as ORD-6C71B1
      or ORD-542FDA.
  capability_validations:
    expected_capabilities:
    - name: search_files
      description: Search workspace for files matching a glob pattern within a directory.
      output:
        check: '{"files": ["docs/customer_report.docx", "docs/travel_summary.docx"]}'
    - name: word_read_file
      description: Read paragraph text from a Word document.
      output:
        check: '{"text": "Customer Activity Report\nMaya Chen\nOrder ORD-6C71B1 |
          2026-09-02 | cancelled | Items: Anker Portable Bluetooth Speaker | Total:
          $79.00\nOrder ORD-5B048F | 2026-09-02 | confirmed | Items: Anker Portable
          Bluetooth Speaker, LogiTech Wireless Mouse M310 | Total: $108.00\nOrder
          ORD-12AAA3 | 2026-09-02 | cancelled | Items: Wireless Ergonomic Mouse |
          Total: $39.00\nOrder ORD-542FDA | 2026-09-02 | confirmed | Items: OXO SoftWorks
          3-Piece Mixing Bowl Set, ThermoPro Digital Meat Thermometer | Total: $68.00"}'
    - name: word_convert_to_pdf
      description: Convert a Word document to PDF.
      output:
        check: '{"status": "Converted docs/customer_report.docx to docs/customer_report.pdf"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "Email sent from olivia.hr.manager@company.com to ethan.it.specialist@company.com
          with subject High Priority: Onboarding Equipment Setup Needed"}'
