id: tc_3975381e
description: You are alice (alice@example.com). You want to add a calendar event for
  alice and then send an email from alice@example.com to bob@example.com about it.
  Alice and Bob both exist in the system, and alice currently has no calendar events,
  so this is a valid setup for creating the event first and then emailing bob.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to add a calendar event
      for alice and then send an email from alice@example.com to bob@example.com about
      it. Alice and Bob both exist in the system, and alice currently has no calendar
      events, so this is a valid setup for creating the event first and then emailing
      bob. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent creates a calendar event for the user alice.
  - check: The agent sends an email from alice@example.com to bob@example.com after
      creating the event.
  - check: The agent confirms that the calendar action for alice succeeded.
  - check: The agent confirms that the email to bob@example.com from alice@example.com
      was sent successfully.
  capability_validations:
    expected_capabilities:
    - name: create_event
      description: Add a calendar event for a user.
      output:
        check: '{"status": "success"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "success"}'
