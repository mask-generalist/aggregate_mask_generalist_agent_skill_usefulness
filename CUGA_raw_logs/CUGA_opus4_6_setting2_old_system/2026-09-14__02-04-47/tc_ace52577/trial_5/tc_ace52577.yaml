id: tc_ace52577
description: You are alice (alice@example.com). You want to find the Excel files in
  the data directory, open data/order_summary.xlsx, update the status for order ORD-6C71B1
  from cancelled to confirmed, and then email bob@example.com about the change. The
  workbook includes Maya Chen's orders dated 2026-09-02, including totals 79.0 and
  108.0, so you want the email to clearly mention the corrected order ID and file
  path.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to find the Excel files
      in the data directory, open data/order_summary.xlsx, update the status for order
      ORD-6C71B1 from cancelled to confirmed, and then email bob@example.com about
      the change. The workbook includes Maya Chen's orders dated 2026-09-02, including
      totals 79.0 and 108.0, so you want the email to clearly mention the corrected
      order ID and file path.
      Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent lists the .xlsx files in data and identifies data/order_summary.xlsx
      among the results.
  - check: The agent reads data/order_summary.xlsx and recognizes that ORD-6C71B1
      for Maya Chen has status cancelled and Total Paid 79.0.
  - check: The agent updates cell Orders R2C4 in data/order_summary.xlsx so that the
      status for ORD-6C71B1 becomes confirmed.
  - check: The agent sends an email from alice to bob stating that ORD-6C71B1 dated
      2026-09-02 was changed from cancelled to confirmed.
  capability_validations:
    expected_capabilities:
    - name: list_files
      description: List files in a directory, optionally filtered by glob pattern.
      output:
        check: '{"files": ["data/order_summary.xlsx", "data/product_inventory.xlsx",
          "data/travel_expenses.xlsx"]}'
    - name: read_file
      description: 'Read all cell values from an Excel file, returning (row, col):
        value pairs.'
      output:
        check: '{"cells": {"Orders:R1C1": "Order ID", "Orders:R1C2": "Customer", "Orders:R1C3":
          "Date", "Orders:R1C4": "Status", "Orders:R1C5": "Items", "Orders:R1C6":
          "Total Paid", "Orders:R2C1": "ORD-6C71B1", "Orders:R2C2": "Maya Chen", "Orders:R2C3":
          "2026-09-02", "Orders:R2C4": "cancelled", "Orders:R2C5": "Anker Portable
          Bluetooth Speaker", "Orders:R2C6": "79.0", "Orders:R3C1": "ORD-5B048F",
          "Orders:R3C2": "Maya Chen", "Orders:R3C3": "2026-09-02", "Orders:R3C4":
          "confirmed", "Orders:R3C5": "Anker Portable Bluetooth Speaker, LogiTech
          Wireless Mouse M310", "Orders:R3C6": "108.0"}}'
    - name: set_cell
      description: Write a value to a specific cell in an Excel file using 1-based
        row/col indices.
      output:
        check: '{"status": "updated data/order_summary.xlsx Orders R2C4 to confirmed"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "Email sent from alice to bob"}'
