id: tc_09b617c5
description: You are the user of device_0. You want to create a new reminder by measuring the time gap between your existing
  reminders "Lunch with Jordan tomorrow at 12:30" and "Follow up with Maya if she's not there by 6:30 PM.", then adding that
  same gap to 1788269400.0. Your device settings for device_0 show location_service is enabled and the device is at 37.7749,
  -122.4194, and this reminder should be created using that location.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are the user of device_0. You want to create a new reminder by measuring the time gap between your existing
      reminders "Lunch with Jordan tomorrow at 12:30" and "Follow up with Maya if she's not there by 6:30 PM.", then adding
      that same gap to 1788269400.0. Your device settings for device_0 show location_service is enabled and the device is
      at 37.7749, -122.4194, and this reminder should be created using that location. Approve code or command from the agent
      if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: toolsandbox-assistant
  agent_response_validations:
  - check: The agent computes the difference between 1788260400.0 and 1788269400.0 as 0 days and 9000 seconds.
  - check: The agent shifts 1788269400.0 forward by 9000 seconds and derives the new reminder timestamp 1788278400.0.
  - check: The agent creates a reminder using the content "Follow up with Maya if she's not there by 6:30 PM." at timestamp
      1788278400.0.
  - check: The agent uses the device_0 location values 37.7749 and -122.4194 when creating the reminder.
  - check: The agent confirms reminder creation by reporting the newly generated reminder ID.
  capability_validations:
    expected_capabilities:
    - name: timestamp_diff
      description: Compute the difference between two POSIX timestamps.
      output:
        check: '{"days": 0, "seconds": 9000}'
    - name: shift_timestamp
      description: Add or subtract a time delta from a POSIX timestamp.
      output:
        check: '{"result": 1788278400.0}'
    - name: add_reminder
      description: Create a new reminder with content and a target timestamp, optionally at a location.
      output:
        check: '{"reminder_id": "newly generated reminder ID"}'
