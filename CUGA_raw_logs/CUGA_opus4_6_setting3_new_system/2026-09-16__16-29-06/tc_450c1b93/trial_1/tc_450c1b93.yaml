id: tc_450c1b93
description: 'You are Emily Carter (person_id: d2be78a1-f8cb-454c-8796-abcad96184cc). You want to check the workspace files,
  then look up your contact entry so a text can be sent to your phone number +1-312-555-0172. Cellular service is ON for device_0,
  but there is no self-contact in the contacts database, so the final send attempt will be blocked even after your contact
  is found. Approve code or command from the agent if prompted'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Emily Carter (person_id: d2be78a1-f8cb-454c-8796-abcad96184cc).  You want to check the workspace
      files, then look up your contact entry so a text can be sent to your phone number +1-312-555-0172. Cellular service
      is ON for device_0, but there is no self-contact in the contacts database, so the final send attempt will be blocked
      even after your contact is found. Approve code or command from the agent if prompted'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: toolsandbox-assistant
  agent_response_validations:
  - check: The agent lists workspace files in the data directory and includes employees.json in the returned files.
  - check: The agent searches contacts for Emily Carter and identifies person_id d2be78a1-f8cb-454c-8796-abcad96184cc with
      phone number +1-312-555-0172.
  - check: The agent attempts to send the message "Hi Emily Carter, please review employees.json." to +1-312-555-0172.
  - check: The agent explains that sending failed because there is no self-contact with is_self=1, even though cellular is
      ON for device_0.
  capability_validations:
    expected_capabilities:
    - name: list_files
      description: List files in a directory, optionally filtered by glob pattern.
      output:
        check: '{"files": ["employees.json", "expenses_q3.json", "inventory.csv", "sales_q3.csv", "support_tickets.csv"]}'
    - name: search_contacts
      description: Search contacts by one or more criteria. name/relationship are fuzzy-matched; person_id/phone_number/is_self
        are exact. Requires at least one criterion.
      output:
        check: '{"result": [{"person_id": "d2be78a1-f8cb-454c-8796-abcad96184cc", "name": "Emily Carter", "phone_number":
          "+1-312-555-0172", "relationship": "coworker", "is_self": 0, "created_at": "2026-09-01T10:00:00"}]}'
    - name: send_message_with_phone_number
      description: Send a text message to a phone number. Requires cellular ON (ConnectionError otherwise) and exactly one
        self-contact.
      output:
        check: '{"message_id": "error: exactly one self-contact required"}'
