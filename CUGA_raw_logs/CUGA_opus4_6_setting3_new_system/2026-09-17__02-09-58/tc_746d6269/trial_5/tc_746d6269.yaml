id: tc_746d6269
description: You are Maya Chen, customer account user_d3d5d0c8. You want to turn cellular service on, look up Maya Bennett's
  phone number, check your shopping account details, and text Maya Bennett an update. Your state-shopping account is maya.chen@example.com
  with gold tier and 0 loyalty points, and Maya Bennett's phone number is +1-415-555-0187.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Maya Chen, customer account user_d3d5d0c8. You want to turn cellular service on, look up Maya Bennett's
      phone number, check your shopping account details, and text Maya Bennett an update. Your state-shopping account is maya.chen@example.com
      with gold tier and 0 loyalty points, and Maya Bennett's phone number is +1-415-555-0187. Approve code or command from
      the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: toolsandbox-assistant
    - skill: state-shopping
  agent_response_validations:
  - check: The agent attempts to enable cellular service but receives a ValueError because cellular is already enabled in
      the snapshot. Since cellular is already on, the prerequisite for texting is still satisfied.
  - check: The agent finds Maya Bennett and identifies her phone number as +1-415-555-0187 from contact person_id 2886d614-b329-4b5b-9bae-aedf8a1fff0d.
  - check: The agent retrieves the customer account for user_d3d5d0c8 and reports Maya Chen, maya.chen@example.com, gold tier,
      and 0 loyalty points.
  - check: The agent attempts the final texting step using +1-415-555-0187 but explains it cannot complete successfully because
      there is no self-contact with is_self=1 in ts_contacts.
  capability_validations:
    expected_capabilities:
    - name: set_cellular_service_status
      description: Toggle cellular service on or off. Raises ValueError if already in the requested state; raises PermissionError
        if low-battery mode is on.
      output:
        check: '{"error": "ValueError: Cellular service is already enabled."}'
    - name: search_contacts
      description: Search contacts by one or more criteria. name/relationship are fuzzy-matched; person_id/phone_number/is_self
        are exact. Requires at least one criterion.
      output:
        check: '{"result": [{"person_id": "2886d614-b329-4b5b-9bae-aedf8a1fff0d", "name": "Maya Bennett", "phone_number":
          "+1-415-555-0187", "relationship": "friend", "is_self": 0, "created_at": "2026-09-01T10:00:00"}]}'
    - name: get_customer_account
      description: 'Get a customer''s account record: name, email, tier, first-time status, loyalty points, and purchase_history.'
      output:
        check: '{"customer_id": "user_d3d5d0c8", "name": "Maya Chen", "email": "maya.chen@example.com", "tier": "gold", "is_first_time":
          false, "loyalty_points": 0, "purchase_history": []}'
    - name: send_message_with_phone_number
      description: Send a text message to a phone number. Requires cellular ON (ConnectionError otherwise) and exactly one
        self-contact.
      output:
        check: '{"message_id": "error because no self-contact with is_self=1 exists in ts_contacts"}'
