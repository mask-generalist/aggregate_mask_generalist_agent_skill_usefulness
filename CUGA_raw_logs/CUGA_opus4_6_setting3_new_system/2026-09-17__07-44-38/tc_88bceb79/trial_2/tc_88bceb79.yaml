id: tc_88bceb79
description: 'You are Maya Bennett (person_id: 2886d614-b329-4b5b-9bae-aedf8a1fff0d). You want to look through the workspace
  files, find Daniel Ortiz in your contacts, and send him a text message at +1-347-555-0169. You know there is already a prior
  message to Daniel Ortiz in the database, and you want the agent to use the available workspace listing before locating his
  contact and messaging that number. Approve code or command from the agent if prompted'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Maya Bennett (person_id: 2886d614-b329-4b5b-9bae-aedf8a1fff0d).  You want to look through the workspace
      files, find Daniel Ortiz in your contacts, and send him a text message at +1-347-555-0169. You know there is already
      a prior message to Daniel Ortiz in the database, and you want the agent to use the available workspace listing before
      locating his contact and messaging that number. Approve code or command from the agent if prompted'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: toolsandbox-assistant
  agent_response_validations:
  - check: The agent lists workspace files under docs/ and identifies docs/meeting_notes_2026_09.txt from the returned files.
  - check: The agent searches contacts for Daniel Ortiz and finds person_id 3f77f374-b93a-4b7d-9982-dddabd4d8150 with phone
      number +1-347-555-0169.
  - check: The agent attempts to send the message content 'Hi Daniel, could you confirm whether you can come by tomorrow between
      2 and 4 PM for the apartment cleaning? Thanks.' to +1-347-555-0169.
  - check: The agent reports that sending cannot succeed because there is no self-contact in ts_contacts with is_self set
      to 1, even though cellular is ON in device_0.
  capability_validations:
    expected_capabilities:
    - name: list_files
      description: List files in a directory, optionally filtered by glob pattern.
      output:
        check: '{"files": ["docs/meeting_notes_2026_09.txt"]}'
    - name: search_contacts
      description: Search contacts by one or more criteria. name/relationship are fuzzy-matched; person_id/phone_number/is_self
        are exact. Requires at least one criterion.
      output:
        check: '{"result": [{"person_id": "3f77f374-b93a-4b7d-9982-dddabd4d8150", "name": "Daniel Ortiz", "phone_number":
          "+1-347-555-0169", "relationship": "freelance cleaner", "is_self": 0, "created_at": "2026-09-01T10:00:00"}]}'
    - name: send_message_with_phone_number
      description: Send a text message to a phone number. Requires cellular ON (ConnectionError otherwise) and exactly one
        self-contact.
      output:
        check: '{"message_id": "ConnectionError because no self-contact exists with is_self=1"}'
