id: tc_3040a560
description: 'You are Maya Bennett (person_id: 2886d614-b329-4b5b-9bae-aedf8a1fff0d). You want to turn off cellular service
  on device_0, look up your contact entry, try to find a tau2Retail account by email, retrieve that retail profile if found,
  and then add yourself as a contact. Your current contact phone number is +1-415-555-0187, and device_0 currently has cellular
  set to 1 with low_battery_mode set to 0. If the retail lookup fails, you still want the assistant to proceed with the device
  and contact steps using the available data. Approve code or command from the agent if prompted'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Maya Bennett (person_id: 2886d614-b329-4b5b-9bae-aedf8a1fff0d).  You want to turn off cellular
      service on device_0, look up your contact entry, try to find a tau2Retail account by email, retrieve that retail profile
      if found, and then add yourself as a contact. Your current contact phone number is +1-415-555-0187, and device_0 currently
      has cellular set to 1 with low_battery_mode set to 0. If the retail lookup fails, you still want the assistant to proceed
      with the device and contact steps using the available data. Approve code or command from the agent if prompted'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: toolsandbox-assistant
    - skill: tau2Retail
  agent_response_validations:
  - check: The agent turns off cellular service on device_0 after recognizing that cellular is currently 1 and low_battery_mode
      is 0.
  - check: The agent finds the existing contact record for Maya Bennett with person_id 2886d614-b329-4b5b-9bae-aedf8a1fff0d
      and phone number +1-415-555-0187.
  - check: The agent attempts a tau2Retail lookup using monica.reyes@northstarfacilities.com and reports that no retail user
      could be found.
  - check: The agent does not fabricate tau2Retail profile details or orders for an empty user_id result.
  - check: The agent adds a new self-contact using the real values Maya Bennett and +1-415-555-0187, noting that no existing
      is_self contact was present before creation.
  capability_validations:
    expected_capabilities:
    - name: set_cellular_service_status
      description: Toggle cellular service on or off. Raises ValueError if already in the requested state; raises PermissionError
        if low-battery mode is on.
      output:
        check: '{"result": "Cellular service disabled."}'
    - name: search_contacts
      description: Search contacts by one or more criteria. name/relationship are fuzzy-matched; person_id/phone_number/is_self
        are exact. Requires at least one criterion.
      output:
        check: '{"result": [{"person_id": "2886d614-b329-4b5b-9bae-aedf8a1fff0d", "name": "Maya Bennett", "phone_number":
          "+1-415-555-0187", "relationship": "friend", "is_self": 0, "created_at": "2026-09-01T10:00:00"}]}'
    - name: find_user_id_by_email
      description: Locate a user id by email (default authentication path).
      output:
        check: '{"user_id": ""}'
    - name: get_user_details
      description: Fetch user profile, payment methods, and order ids.
      output:
        check: '{"user_id": "", "name": "", "address": "", "email": "", "payment_methods": [], "orders": []}'
    - name: add_contact
      description: Add a new contact to the database. Raises DuplicateError if adding a second self-contact.
      output:
        check: '{"person_id": "newly generated person ID"}'
