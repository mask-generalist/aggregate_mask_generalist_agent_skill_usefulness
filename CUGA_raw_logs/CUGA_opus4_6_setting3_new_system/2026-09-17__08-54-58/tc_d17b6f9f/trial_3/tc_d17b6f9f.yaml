id: tc_d17b6f9f
description: You are Sofia Martinez (cust_003). You want to have the agent look up your account by name and zip code, retrieve
  your customer profile, find the contact Sofia Ramirez, and send a text message to +1-917-555-0148. Your state-customer-support
  account shows standard membership and a store credit balance of 0, and the device has cellular enabled on device_0. The
  agent should still attempt the full chain even though the retail lookup and final message send are blocked by missing required
  data. Approve code or command from the agent if prompted
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Sofia Martinez (cust_003). You want to have the agent look  up your account by name and zip code,
      retrieve your customer profile, find the contact Sofia Ramirez, and send a text message to +1-917-555-0148. Your state-customer-support
      account shows standard membership and a store credit balance of 0, and the device has cellular enabled on device_0.
      The agent should still attempt the full chain even though the retail lookup and final message send are blocked by missing
      required data. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: tau2Retail
    - skill: state-customer-support
    - skill: toolsandbox-assistant
  agent_response_validations:
  - check: The agent should attempt to look up Sofia Martinez using first_name Sofia and last_name Martinez, and make clear
      that the tau2Retail lookup could not produce a user_id.
  - check: The agent should retrieve and report the state-customer-support profile for cust_003, including name Sofia Martinez,
      membership_tier standard, store_credit_balance 0, and has_prime_shipping false.
  - check: The agent should search contacts by the name Sofia and identify Sofia Ramirez with person_id a2f34471-50af-42dd-b614-bbb9aff787b7
      and phone number +1-917-555-0148.
  - check: The agent should attempt to send a message to +1-917-555-0148 with content Hi Sofia Ramirez, this is Sofia Martinez.
      but explain that sending cannot succeed because there is no ts_contacts entry with is_self set to 1.
  capability_validations:
    expected_capabilities:
    - name: find_user_id_by_name_zip
      description: Locate a user id by first name, last name, and zip code (fallback when email is unknown).
      output:
        check: '{"user_id": ""}'
    - name: get_customer
      description: Retrieve customer profile including membership tier, store credit balance, and preference settings.
      output:
        check: '{"customer_id": "cust_003", "name": "Sofia Martinez", "membership_tier": "standard", "store_credit_balance":
          0, "has_prime_shipping": false, "benefits": "{}"}'
    - name: search_contacts
      description: Search contacts by one or more criteria. name/relationship are fuzzy-matched; person_id/phone_number/is_self
        are exact. Requires at least one criterion.
      output:
        check: '{"result": [{"person_id": "a2f34471-50af-42dd-b614-bbb9aff787b7", "name": "Sofia Ramirez", "phone_number":
          "+1-917-555-0148", "relationship": "friend", "is_self": 0, "created_at": "2026-09-01T10:00:00"}]}'
    - name: send_message_with_phone_number
      description: Send a text message to a phone number. Requires cellular ON (ConnectionError otherwise) and exactly one
        self-contact.
      output:
        check: '{"message_id": ""}'
