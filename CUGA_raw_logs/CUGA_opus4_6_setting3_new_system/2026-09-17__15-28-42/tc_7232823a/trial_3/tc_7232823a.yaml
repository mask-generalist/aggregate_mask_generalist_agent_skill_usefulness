id: tc_7232823a
description: You are Caleb Foster (user_58b0a2d6). You want to look up customer Emma Chen's (cust_001) support profile, try
  redeeming loyalty points on your current cart, check the cart contents, update one cart item, and then remove another item
  entirely. Your current cart CART-user_58b0a2d6 totals 460 and contains CI-0005, CI-0006, and CI-0007. You also need the
  agent to recognize that no available user has the 500-point minimum required for loyalty redemption. Approve code or command
  from the agent if prompted
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Caleb Foster (user_58b0a2d6). You want to look up customer  Emma Chen's (cust_001) support profile,
      try redeeming loyalty points on your current cart, check the cart contents, update one cart item, and then remove another
      item entirely. Your current cart CART-user_58b0a2d6 totals 460 and contains CI-0005, CI-0006, and CI-0007. You also
      need the agent to recognize that no available user has the 500-point minimum required for loyalty redemption. Approve
      code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-customer-support
    - skill: state-shopping
  agent_response_validations:
  - check: The agent must retrieve and report Emma Chen's customer-support profile for cust_001, including platinum membership
      and store credit balance 150.
  - check: The agent must attempt loyalty redemption for user_58b0a2d6 on CART-user_58b0a2d6 with 500 points and explicitly
      state that redemption is invalid because the available loyalty points are insufficient.
  - check: The agent must show that Caleb Foster's cart CART-user_58b0a2d6 initially totals 460 and contains CI-0005, CI-0006,
      and CI-0007.
  - check: The agent must update cart item CI-0005 for Harbor Cotton Crew Tee so gift wrap is enabled while quantity remains
      1.
  - check: The agent must remove product PROD-B7C77D, Metro Stretch Chino Pants, from CART-user_58b0a2d6 and report the new
      cart total as 316.
  capability_validations:
    expected_capabilities:
    - name: get_customer
      description: Retrieve customer profile including membership tier, store credit balance, and preference settings.
      output:
        check: '{"customer_id": "cust_001", "name": "Emma Chen", "membership_tier": "platinum", "store_credit_balance": 150,
          "has_prime_shipping": false, "benefits": ["platinum"]}'
    - name: redeem_loyalty_points
