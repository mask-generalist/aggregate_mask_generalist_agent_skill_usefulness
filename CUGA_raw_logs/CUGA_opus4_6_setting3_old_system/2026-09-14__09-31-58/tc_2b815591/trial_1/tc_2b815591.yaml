      PROD-F9994E, which is out of stock. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-shopping
  agent_response_validations:
  - check: The agent updates cart item CI-0006 from quantity 3 to quantity 2 for RidgeLine Fleece Zip Hoodie.
  - check: The agent removes PROD-F9994E, the Harbor Cotton Crew Tee, from CART-user_58b0a2d6 because it is out of stock.
  - check: The agent provides shipping choices for Caleb Foster and includes that standard costs 0, expedited costs 15, and
      overnight costs 25.
  - check: The agent retrieves the shipping policy for topic shipping and mentions that Caleb Foster has_prime_shipping is
      0.
  - check: The agent applies expedited shipping to CART-user_58b0a2d6 and confirms the cart total becomes 337 with shipping_cost
      15.
  capability_validations:
    expected_capabilities:
    - name: update_cart_item
      description: Update an existing cart item's quantity or gift-wrap flag. Setting quantity=0 removes the item from the
        cart.
      output:
        check: '{"cart_item_id": "CI-0006", "cart": {"cart_id": "CART-user_58b0a2d6", "customer_id": "user_58b0a2d6", "subtotal":
          371, "discount_amount": 0, "gift_wrap_fee": 0, "loyalty_discount": 0, "loyalty_points_redeemed": 0, "shipping_option":
          "standard", "shipping_cost": 0, "total": 371, "applied_promo_codes_json": "[]", "item_ids_json": "[\"CI-0005\",
          \"CI-0006\", \"CI-0007\"]"}}'
    - name: remove_from_cart
      description: Remove a product from the customer's cart entirely.
      output:
        check: '{"cart": {"cart_id": "CART-user_58b0a2d6", "customer_id": "user_58b0a2d6", "subtotal": 322, "discount_amount":
          0, "gift_wrap_fee": 0, "loyalty_discount": 0, "loyalty_points_redeemed": 0, "shipping_option": "standard", "shipping_cost":
          0, "total": 322, "applied_promo_codes_json": "[]", "item_ids_json": "[\"CI-0006\", \"CI-0007\"]"}}'
    - name: get_shipping_options
      description: List shipping options available for the customer's cart. Returns each option's cost, ETA, and tier-eligibility
        note. Use only when the customer explicitly asks about shipping.
      output:
        check: '{"options": [{"option": "standard", "cost": 0, "eta": "3 days", "tier_eligibility_note": "standard"}, {"option":
          "expedited", "cost": 15, "eta": "2 days", "tier_eligibility_note": "standard"}, {"option": "overnight", "cost":
          25, "eta": "1 day", "tier_eligibility_note": "standard"}]}'
    - name: get_policies
      description: Look up the store's policy for a given topic. Returns a summary and a list of rules.
      output:
        check: '{"topic": "shipping", "summary": "Shipping options include standard, expedited, and overnight delivery, with
          costs and delivery windows varying by option and eligibility.", "rules": ["Standard shipping is available on CART-user_58b0a2d6
          and is currently set with shipping_cost 0.", "Caleb Foster does not have prime shipping because has_prime_shipping
          is 0.", "Shipping selection updates cart.total when a paid option is chosen."]}'
    - name: set_shipping_option
      description: Write a shipping option to the cart. Adds shipping_cost to cart.total. Calling again overwrites the prior
        value.
      output:
        check: '{"shipping_option": "expedited", "shipping_cost": 15, "cart": {"cart_id": "CART-user_58b0a2d6", "customer_id":
          "user_58b0a2d6", "subtotal": 322, "discount_amount": 0, "gift_wrap_fee": 0, "loyalty_discount": 0, "loyalty_points_redeemed":
