test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Caleb Foster (user_58b0a2d6). You want to update your cart by changing CI-0006, remove the out-of-stock
      Harbor Cotton Crew Tee from CART-user_58b0a2d6, check shipping options, review the shipping policy, and then choose
