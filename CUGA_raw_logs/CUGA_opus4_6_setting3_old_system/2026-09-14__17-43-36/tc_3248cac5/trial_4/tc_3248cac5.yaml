id: tc_3248cac5
description: You are Sofia Martinez (customer ID cust_003). You want to process a return under the company's return policy
  and then text Maya Bennett at +1-415-555-0187 with the return outcome. Your preferred refund method is original_payment,
  and your saved payment method is visa ending 8861. Cellular is ON on device_0, but there is currently no self-contact in
  your contacts.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Sofia Martinez (customer ID cust_003). You want to process a return under the company's return policy
      and then text Maya Bennett at +1-415-555-0187 with the return outcome. Your preferred refund method is original_payment,
      and your saved payment method is visa ending 8861. Cellular is ON on device_0, but there is currently no self-contact
      in your contacts. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-customer-support
    - skill: toolsandbox-assistant
  agent_response_validations:
  - check: The agent must check the return policy for topic "return" before attempting to use process_return for Sofia Martinez
      (cust_003).
  - check: The agent must carry out the required two-step return flow for process_return and use the computed refund amount
      before final confirmation.
  - check: The agent must recognize that device_0 has cellular set to 1 but that no ts_contacts entry has is_self = 1, so
      sending to Maya Bennett at +1-415-555-0187 cannot succeed until a self-contact exists.
  - check: If the agent reports the messaging step outcome, it must reference the intended recipient Maya Bennett and phone
      number +1-415-555-0187.
  capability_validations:
    expected_capabilities:
    - name: get_policies
      description: Look up the company's policies for a given topic. Must be called before using any write tool (process_return,
        process_refund, cancel_order, process_exchange, process_warranty_claim).
      output:
        check: '{"topic": "return", "rules": ["return"]}'
    - name: process_return
      description: 'Process a return for an order item. Two-step operation: first call without confirm to preview the return
        (eligibility, fees, component breakdown), then call again with confirm=true and amount=<computed net refund> to execute.
        Requires prior call to get_policies(topic=''return'').'
      output:
        check: '{"status": "processed", "item_id": "cust_003", "refund_amount": 0, "refund_method": "original_payment", "restocking_fee":
          0, "restocking_discount": 0, "shipping_clawback": 0, "bulk_clawback": 0, "repeat_surcharge": 0, "paid_return_shipping_fee":
          0}'
    - name: send_message_with_phone_number
      description: Send a text message to a phone number. Requires cellular ON (ConnectionError otherwise) and exactly one
        self-contact.
      output:
        check: '{"message_id": "newly generated message ID"}'
