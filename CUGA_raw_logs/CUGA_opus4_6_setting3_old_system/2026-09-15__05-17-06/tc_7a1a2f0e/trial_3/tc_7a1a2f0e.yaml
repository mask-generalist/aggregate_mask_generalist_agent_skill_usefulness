id: tc_7a1a2f0e
description: You are Maya Chen (user_d3d5d0c8). You want to exchange the LogiTech Wireless Mouse M310 from order ORD-5B048F
  for the Wireless Ergonomic Mouse and then send a text update to Daniel Ortiz at +1-347-555-0169. The item you want to exchange
  is ITEM-70E770, which was purchased for $29, and the replacement product PROD-2DBA15 costs $39, so you expect a $10 price
  difference. Before completing the exchange, the agent should check the exchange policy. Approve code or command from the
  agent if prompted
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Maya Chen (user_d3d5d0c8). You want to exchange the LogiTech  Wireless Mouse M310 from order ORD-5B048F
      for the Wireless Ergonomic Mouse and then send a text update to Daniel Ortiz at +1-347-555-0169. The item you want to
      exchange is ITEM-70E770, which was purchased for $29, and the replacement product PROD-2DBA15 costs $39, so you expect
      a $10 price difference. Before completing the exchange, the agent should check the exchange policy. Approve code or
      command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-customer-support
    - skill: toolsandbox-assistant
  agent_response_validations:
  - check: The agent checks the exchange policy before attempting to process an exchange for ITEM-70E770.
  - check: The agent completes the exchange from ITEM-70E770 to PROD-2DBA15 and states that Maya Chen must pay the $10 price
      difference.
  - check: The agent references order ORD-5B048F when explaining the exchange outcome.
  - check: The agent sends a text message to Daniel Ortiz at +1-347-555-0169 after the exchange is completed.
  capability_validations:
    expected_capabilities:
    - name: get_policies
      description: Look up the company's policies for a given topic. Must be called before using any write tool (process_return,
        process_refund, cancel_order, process_exchange, process_warranty_claim).
      output:
        check: '{"topic": "exchange", "rules": "Exchanges are allowed for confirmed items within the 30-day return window
          when the replacement product is in stock. A preview should show any price difference before confirmation."}'
    - name: process_exchange
      description: 'Exchange an item for a different product or variant. Two-step operation: first call without confirm to
        preview (price difference, eligibility), then call with confirm=true to execute. Requires prior call to get_policies(topic=''exchange'').'
      output:
        check: '{"status": "exchanged", "item_id": "ITEM-70E770", "new_item_id": "ITEM-70E770", "new_product_id": "PROD-2DBA15",
          "price_difference": 10, "customer_pays": 10, "store_credit_refund": 0}'
    - name: send_message_with_phone_number
      description: Send a text message to a phone number. Requires cellular ON (ConnectionError otherwise) and exactly one
        self-contact.
      output:
        check: '{"message_id": "newly generated message ID"}'
