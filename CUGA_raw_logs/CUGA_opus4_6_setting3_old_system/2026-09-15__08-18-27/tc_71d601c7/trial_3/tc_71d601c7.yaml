id: tc_71d601c7
description: 'You are Liam Johnson (user_id: cust_004). You want to exchange item ITEM-10141 from delivered order ORD-7113.
  You first check the Anker Portable Bluetooth Speaker (product_id: PROD-B98D14) via product details, but ultimately decide
  to exchange for SprintMax Running Shoes (product_id: PROD-4528) which is available in the exchange system. You also want
  the agent to check the exchange policy, your order details, and the warranty status on the original item. The original item
  is SoundMax Wireless Headphones (product_id: PROD-3141) purchased for 249, and you want the agent to preview the exchange
  before confirming it. You also want to know whether the warranty on ITEM-10141 is still active and whether prior claims
  affect anything. Approve code or command from the agent if prompted'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Liam Johnson (user_id: cust_004). You want to exchange  item ITEM-10141 from delivered order ORD-7113.
      You first check the Anker Portable Bluetooth Speaker (product_id: PROD-B98D14) via product details, but ultimately decide
      to exchange for SprintMax Running Shoes (product_id: PROD-4528) which is available in the exchange system. You also
      want the agent to check the exchange policy, your order details, and the warranty status on the original item. The original
      item is SoundMax Wireless Headphones (product_id: PROD-3141) purchased for 249, and you want the agent to preview the
      exchange before confirming it. You also want to know whether the warranty on ITEM-10141 is still active and whether
      prior claims affect anything. Approve code or command from the agent if prompted'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: tau2Retail
    - skill: state-customer-support
  agent_response_validations:
  - check: The agent must first look up product PROD-B98D14 and identify it as Anker Portable Bluetooth Speaker before attempting
      any exchange.
  - check: The agent must retrieve the exchange policy for topic exchange before calling process_exchange for ITEM-10141.
  - check: The agent must confirm that order ORD-7113 belongs to customer cust_004 and contains ITEM-10141, SoundMax Wireless
      Headphones, priced at 249.
  - check: The agent must report that warranty WRT-4012 for ITEM-10141 is active but has claim_count 3 out of max_claims 3.
  - check: The agent must state that exchanging ITEM-10141 for PROD-4528 (SprintMax Running Shoes at 129) results in a 120
      store credit refund and no additional customer payment, since the original item was priced at 249.
  capability_validations:
    expected_capabilities:
    - name: get_product_details
      description: Fetch a product and its variants including options, availability, and prices.
      output:
        check: '{"name": "Anker Portable Bluetooth Speaker", "product_id": "PROD-B98D14", "variants": []}'
    - name: get_policies
      description: Look up the company's policies for a given topic. Must be called before using any write tool (process_return,
        process_refund, cancel_order, process_exchange, process_warranty_claim).
      output:
        check: '{"topic": "exchange", "rules": "Exchanges require delivered items to be within the applicable return window.
          Electronics in order ORD-7113 use a 15-day return window. Item ITEM-10141 from PROD-3141 is eligible for exchange
          if the replacement product is in stock. Exchange price differences may require customer payment or may be refunded
          as store credit."}'
    - name: get_order
      description: Retrieve full details of an order by its order ID, including all items in the order and product details
        for each item.
      output:
        check: '{"order_id": "ORD-7113", "customer_id": "cust_004", "status": "delivered", "shipping_status": "delivered",
          "items": [{"item_id": "ITEM-10141", "product_id": "PROD-3141", "name": "SoundMax Wireless Headphones", "quantity":
          1, "unit_price": 249, "item_status": "delivered"}]}'
    - name: get_warranty_status
      description: Check the warranty status for a specific item. Returns warranty type, coverage period, claim history, and
        current eligibility.
      output:
        check: '{"warranty_id": "WRT-4012", "has_warranty": true, "is_active": true, "days_until_expiry": 272, "days_past_expiry":
          0, "claim_count": 3, "max_claims": 3}'
    - name: process_exchange
      description: 'Exchange an item for a different product or variant. Two-step operation: first call without confirm to
        preview (price difference, eligibility), then call with confirm=true to execute. Requires prior call to get_policies(topic=''exchange'').'
      output:
        check: '{"status": "exchanged", "item_id": "ITEM-10141", "new_item_id": "ITEM-10141", "new_product_id": "PROD-4528",
          "price_difference": 120, "customer_pays": 0, "store_credit_refund": 120}'
