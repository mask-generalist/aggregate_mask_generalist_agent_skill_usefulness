id: tc_693bc59a
description: You are Maya Chen (customer account user_d3d5d0c8). You want to check your shopping account details and then
  text Daniel Ortiz at +1-347-555-0169 with an update. Your account email is maya.chen@example.com, your loyalty tier is gold,
  and you currently have 0 loyalty points. You also have an active cart CART-user_d3d5d0c8 with 1 item, the Harbor Cotton
  Crew Tee priced at 49. Approve code or command from the agent if prompted
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Maya Chen (customer account user_d3d5d0c8). You want to  check your shopping account details and
      then text Daniel Ortiz at +1-347-555-0169 with an update. Your account email is maya.chen@example.com, your loyalty
      tier is gold, and you currently have 0 loyalty points. You also have an active cart CART-user_d3d5d0c8 with 1 item,
      the Harbor Cotton Crew Tee priced at 49. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-shopping
    - skill: toolsandbox-assistant
  agent_response_validations:
  - check: The agent retrieves the customer account for user_d3d5d0c8 and identifies Maya Chen as a gold-tier customer with
      0 loyalty points.
  - check: The agent states that maya.chen@example.com is the email on Maya Chen's account and that is_first_time is false.
  - check: The agent attempts to send a text to Daniel Ortiz at +1-347-555-0169 using toolsandbox-assistant.send_message_with_phone_number.
  - check: Before sending, the agent recognizes that ts_device_settings shows cellular is ON for device_0 but there is no
      self-contact in ts_contacts because all listed contacts have is_self set to 0.
  capability_validations:
    expected_capabilities:
    - name: get_customer_account
      description: 'Get a customer''s account record: name, email, tier, first-time status, loyalty points, and purchase_history.'
      output:
        check: '{"customer_id": "user_d3d5d0c8", "name": "Maya Chen", "email": "maya.chen@example.com", "tier": "gold", "is_first_time":
          false, "loyalty_points": 0, "purchase_history": []}'
    - name: send_message_with_phone_number
      description: Send a text message to a phone number. Requires cellular ON (ConnectionError otherwise) and exactly one
        self-contact.
      output:
        check: '{"message_id": "newly generated message ID"}'
