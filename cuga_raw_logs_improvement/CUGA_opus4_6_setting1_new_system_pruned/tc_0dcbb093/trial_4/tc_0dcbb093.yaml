id: tc_0dcbb093
description: You are Rachel Kim (E001), VP of Sales at Meridian Analytics. You want
  to read the Q3 2026 business report and then save a new workspace file containing
  the exact report text for distribution to the Executive Team. The report covers
  July 1 – September 7, 2026 and states that Meridian Analytics generated $1,040,000
  in new contract value.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Rachel Kim (E001), VP of Sales at Meridian Analytics. You
      want to read the Q3 2026 business report and then save a new workspace file
      containing the exact report text for distribution to the Executive Team. The
      report covers July 1 – September 7, 2026 and states that Meridian Analytics
      generated $1,040,000 in new contract value. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent reads docs/q3_report.md before writing any file content.
  - check: The agent preserves the report title "Meridian Analytics — Q3 2026 Business
      Report" in the written content.
  - check: The agent includes the prepared-by line with Rachel Kim and Claire Fontaine
      in the written file content.
  - check: The agent preserves the executive summary amount **$1,040,000** in the
      final written content.
  capability_validations:
    expected_capabilities:
    - name: read_file
      description: Read file contents from workspace, optionally filtering by line
        range or regex pattern.
      output:
        check: '{"content": "# Meridian Analytics \u2014 Q3 2026 Business Report\n\n**Period:**
          July 1 \u2013 September 7, 2026\n**Prepared by:** Rachel Kim, VP of Sales
          | Claire Fontaine, CFO\n**Distribution:** Executive Team\n\n---\n\n## Executive
          Summary\n\nQ3 2026 marks another strong quarter for Meridian Analytics.
          Across our 15-person team we\nclosed 14 deals out of 22 opportunities, generating
          **$1,040,000** in new\ncontract value."}'
    - name: write_file
      description: Write content to a file, creating it if it does not exist or overwriting
        if it does.
      output:
        check: '{"success": true}'
