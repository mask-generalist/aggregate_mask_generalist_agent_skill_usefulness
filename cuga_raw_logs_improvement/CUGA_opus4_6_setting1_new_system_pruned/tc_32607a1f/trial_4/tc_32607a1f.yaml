id: tc_32607a1f
description: 'You are olivia.hr.manager (olivia.hr.manager@company.com). You want
  to draft a professional and concise follow-up email about the existing request with
  subject "High Priority: Onboarding Equipment Setup Needed" and then send it to ethan.it.specialist
  at ethan.it.specialist@company.com. The prior email asks for a standard Windows
  laptop, VPN access, and email configured before start of business on the next business
  day, so you want the agent to use that context when generating the message.'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are olivia.hr.manager (olivia.hr.manager@company.com). You
      want to draft a professional and concise follow-up email about the existing
      request with subject "High Priority: Onboarding Equipment Setup Needed" and
      then send it to ethan.it.specialist at ethan.it.specialist@company.com. The
      prior email asks for a standard Windows laptop, VPN access, and email configured
      before start of business on the next business day, so you want the agent to
      use that context when generating the message. Approve code or command from the agent if prompted.'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: 'The agent drafts email content that explicitly mentions ethan.it.specialist@company.com
      and the subject "High Priority: Onboarding Equipment Setup Needed."'
  - check: The agent includes the onboarding requirements "standard Windows laptop,"
      "VPN access," and "email configured before start of business on the next business
      day" in the generated message.
  - check: The agent sends the email as olivia.hr.manager to ethan.it.specialist@company.com.
  - check: The agent states or confirms that the email was sent with status "sent"
      after using the drafted content.
  capability_validations:
    expected_capabilities:
    - name: complete_text
      description: Send a prompt to the configured LLM and return the response.
      output:
        check: '{"response": "Hello Ethan,\n\nFollowing up on the onboarding equipment
          setup request, please ensure the contractor''s standard Windows laptop,
          VPN access, and email are configured before start of business on the next
          business day.\n\nPlease prioritize this request.\n\nBest,\nOlivia"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "sent"}'
