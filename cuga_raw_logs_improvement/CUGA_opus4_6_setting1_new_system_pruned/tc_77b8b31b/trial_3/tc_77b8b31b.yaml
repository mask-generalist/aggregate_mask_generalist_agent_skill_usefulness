id: tc_77b8b31b
description: You are alice (alice@example.com). You want to convert docs/customer_report.docx
  to a PDF and email it to bob@example.com. The document is a customer activity report
  that includes Maya Chen and orders ORD-6C71B1 and ORD-5B048F, and you want bob to
  receive it.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to convert docs/customer_report.docx
      to a PDF and email it to bob@example.com. The document is a customer activity
      report that includes Maya Chen and orders ORD-6C71B1 and ORD-5B048F, and you
      want bob to receive it. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent converts docs/customer_report.docx to a PDF before sending the
      email.
  - check: The agent sends the email from alice to bob@example.com.
  - check: The agent's email mentions Maya Chen.
  - check: The agent's email references order ORD-6C71B1 and order ORD-5B048F.
  capability_validations:
    expected_capabilities:
    - name: word_convert_to_pdf
      description: Convert a Word document to PDF.
      output:
        check: '{"status": "success"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "success"}'
