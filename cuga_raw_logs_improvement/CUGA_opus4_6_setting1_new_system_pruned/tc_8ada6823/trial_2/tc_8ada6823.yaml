id: tc_8ada6823
description: You are alice (alice@example.com). You want to create a new Excel file
  and enter a value into it. You are the only user in the system snapshot, and no
  Excel files currently exist, so this requires creating a new file first and then
  writing a value associated with alice into a cell.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to create a new Excel
      file and enter a value into it. You are the only user in the system snapshot,
      and no Excel files currently exist, so this requires creating a new file first
      and then writing a value associated with alice into a cell. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent creates a new Excel file for alice using the account alice@example.com
      before attempting any cell update.
  - check: The agent uses OfficeBench.set_cell after file creation to write the specific
      value alice@example.com.
  - check: The agent writes alice@example.com into row 1, column 1 of the new Excel
      file.
  - check: The agent confirms completion in a way that references alice or alice@example.com.
  capability_validations:
    expected_capabilities:
    - name: create_new_file
      description: Create a new empty Excel file.
      output:
        check: '{"status": "created"}'
    - name: set_cell
      description: Write a value to a specific cell in an Excel file using 1-based
        row/col indices.
      output:
        check: '{"status": "written"}'
