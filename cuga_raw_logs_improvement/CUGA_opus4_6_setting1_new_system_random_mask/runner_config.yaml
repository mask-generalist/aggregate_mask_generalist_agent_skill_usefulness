judge:
  model: azure/gpt-5.4
  max_tokens: 4096
  num_judge_trials: 5

# Trace converter (REQUIRED). stream = fixes truncation; legacy = truncated.
trace_converter: stream # stream or legacy

user_proxy:
  model: azure/gpt-4.1
  max_tokens: 4096
  use_expert_agent: true

# S_new = S_old (OfficeBench + tau2Airline) PLUS the new state-travel skill.
skills:
  tau2Airline: true
  tau2Retail: false
  OfficeBench: true
  state-customer-support: false
  state-shopping: false
  state-travel: false
  state-travel_pruned: false
  state-travel_random_rm: true
  toolsandbox-assistant: false
