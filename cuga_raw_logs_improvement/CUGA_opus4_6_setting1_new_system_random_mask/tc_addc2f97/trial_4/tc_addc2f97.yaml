id: tc_addc2f97
description: You are alice (alice@example.com). You want to read the contents of docs/customer_report.docx,
  convert it to PDF, and email it to bob@example.com. The document is a customer activity
  report for Maya Chen and includes orders ORD-6C71B1 and ORD-5B048F from 2026-09-02,
  so you want the PDF version shared by email after confirming the text.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to read the contents
      of docs/customer_report.docx, convert it to PDF, and email it to bob@example.com.
      The document is a customer activity report for Maya Chen and includes orders
      ORD-6C71B1 and ORD-5B048F from 2026-09-02, so you want the PDF version shared
      by email after confirming the text. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent reads docs/customer_report.docx and references Maya Chen from
      the document contents.
  - check: The agent confirms the document includes order ORD-6C71B1 with total $79
      and order ORD-5B048F with total $108.
  - check: The agent converts docs/customer_report.docx to PDF before sending the
      email.
  - check: The agent sends the email from alice to bob@example.com with the subject
      Customer Activity Report.
  capability_validations:
    expected_capabilities:
    - name: word_read_file
      description: Read paragraph text from a Word document.
      output:
        check: '{"text": "Customer Activity Report\nMaya Chen\nEmail: maya.chen@example.com
          | Loyalty Tier: gold | Store Credit: $0\nOrder ORD-6C71B1 \u2014 2026-09-02
          | Status: cancelled | Total: $79\n  Items: Anker Portable Bluetooth Speaker\nOrder
          ORD-5B048F \u2014 2026-09-02 | Status: confirmed | Total: $108\n  Items:
          Anker Portable Bluetooth Speaker, LogiTech Wireless Mouse M310"}'
    - name: word_convert_to_pdf
      description: Convert a Word document to PDF.
      output:
        check: '{"status": "success"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "sent"}'
