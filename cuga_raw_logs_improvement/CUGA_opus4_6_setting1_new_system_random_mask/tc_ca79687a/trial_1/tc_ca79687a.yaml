id: tc_ca79687a
description: You are olivia.hr.manager (olivia.hr.manager@company.com). You want to
  add a calendar event for yourself and then email priya.it.lead@company.com about
  it. You already have calendar events like "New Hire Readiness Check (Virtual) —
  laptop, VPN/email, day-one setup" and "Contractor Day-One Setup Check — laptop,
  VPN/email, access readiness," and you have previously emailed priya.it.lead@company.com.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are olivia.hr.manager (olivia.hr.manager@company.com). You want
      to add a calendar event for yourself and then email priya.it.lead@company.com
      about it. You already have calendar events like "New Hire Readiness Check (Virtual)
      — laptop, VPN/email, day-one setup" and "Contractor Day-One Setup Check — laptop,
      VPN/email, access readiness," and you have previously emailed priya.it.lead@company.com. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent creates a calendar event for olivia.hr.manager using the summary
      "New Hire Readiness Check (Virtual) — laptop, VPN/email, day-one setup".
  - check: The agent uses the event time 2026-09-08T10:00:00 to 2026-09-08T10:30:00
      for the calendar creation step.
  - check: After creating the event, the agent sends an email from olivia.hr.manager
      to priya.it.lead@company.com.
  - check: 'The agent uses the subject "High Priority: Onboarding Equipment Setup
      Needed - Follow-Up" in the email to priya.it.lead@company.com.'
  capability_validations:
    expected_capabilities:
    - name: create_event
      description: Add a calendar event for a user.
      output:
        check: '{"status": "success"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "success"}'
