id: tc_07c13162
description: You are shopping for a wireless mouse in the electronics category and want to confirm the best match, inspect
  its full details, verify whether it has any variants, and check if it is compatible with Mac. You are specifically interested
  in the LogiTech Wireless Mouse M310 priced at 29, which has a 4.9 rating from 1247 reviews. Before deciding, you want to
  confirm its stock status, shipping time of 3 days, and whether it supports Mac.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are shopping for a wireless mouse in the electronics category and want to confirm the best match, inspect
      its full details, verify whether it has any variants, and check if it is compatible with Mac. You are specifically interested
      in the LogiTech Wireless Mouse M310 priced at 29, which has a 4.9 rating from 1247 reviews. Before deciding, you want
      to confirm its stock status, shipping time of 3 days, and whether it supports Mac. Approve code or command from the
      agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-shopping
  agent_response_validations:
  - check: The agent searches for "wireless mouse" in the electronics category and surfaces PROD-FA0948 as a relevant top
      result.
  - check: The agent reports that PROD-FA0948 is LogiTech Wireless Mouse M310 priced at 29 with rating 4.9 from 1247 reviews.
  - check: The agent confirms that PROD-FA0948 is in stock with stock_quantity 120, shipping_days 3, and gift_wrap_available
      true.
  - check: The agent checks variants for PROD-FA0948 and states that the variants list is empty.
  - check: The agent checks compatibility for PROD-FA0948 with Mac and states that the result is compatible true.
  capability_validations:
    expected_capabilities:
    - name: search_products
      description: Search the product catalog. Returns up to 10 ranked products. Hard filters narrow the candidate pool; query
        soft-ranks survivors by matching against product name, brand, subcategory, description, and spec keys/values.
      output:
        check: '{"products": [{"product_id": "PROD-FA0948", "name": "LogiTech Wireless Mouse M310", "category": "electronics",
          "brand": "LogiTech", "price": 29}, {"product_id": "PROD-7C0240", "name": "Wireless Mouse", "category": "electronics",
          "brand": "LogiCore", "price": 29}, {"product_id": "PROD-2DBA15", "name": "Wireless Ergonomic Mouse", "category":
          "electronics", "brand": "Northfield Tech", "price": 39}]}'
    - name: get_product_details
      description: Get full details of a product including specs, description, stock, shipping days, gift_wrap_available,
        compatible_with list, any recent price drop, and any variants.
      output:
        check: '{"product_id": "PROD-FA0948", "name": "LogiTech Wireless Mouse M310", "category": "electronics", "brand":
          "LogiTech", "price": 29, "previous_price": null, "rating": 4.9, "review_count": 1247, "description": "Reliable wireless
          optical mouse with USB receiver, suitable for home office and travel.", "specs": {"connectivity": "Wireless 2.4GHz",
          "battery_type": "AA", "dpi": "1000", "compatibility": "Windows/Mac"}, "compatible_with": ["PROD-B98D14", "PROD-2DBA15",
          "PROD-7C0240", "PROD-73FAB4"], "in_stock": true, "stock_quantity": 120, "shipping_days": 3, "gift_wrap_available":
          true, "backorder_available": false, "variants": []}'
    - name: get_variants
      description: List the variants (e.g. color, size) available for a product along with per-variant stock and effective
        price. Returns an empty list for products without variants.
      output:
        check: '{"variants": []}'
    - name: check_compatibility
      description: Check whether a product is compatible with a specific device. Device names must match the canonical vocabulary
        exactly.
      output:
        check: '{"compatible": true, "device_name": "Mac", "product_id": "PROD-FA0948"}'
