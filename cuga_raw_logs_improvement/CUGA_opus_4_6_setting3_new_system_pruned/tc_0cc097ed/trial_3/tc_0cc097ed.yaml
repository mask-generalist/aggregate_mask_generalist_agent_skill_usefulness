          "name": "RidgeLine Fleece Zip Hoodie", "quantity": 3, "unit_price": 89, "line_total": 267}, {"cart_item_id": "CI-0007",
          "product_id": "PROD-B7C77D", "name": "Metro Stretch Chino Pants", "quantity": 2, "unit_price": 72, "line_total":
