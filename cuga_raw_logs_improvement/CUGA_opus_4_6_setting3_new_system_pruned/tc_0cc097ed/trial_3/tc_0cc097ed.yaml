      output:
        check: '{"cart_id": "CART-user_58b0a2d6", "customer_id": "user_58b0a2d6", "items": [{"cart_item_id": "CI-0005", "product_id":
          "PROD-F9994E", "name": "Harbor Cotton Crew Tee", "quantity": 1, "unit_price": 49, "line_total": 49}, {"cart_item_id":
          "CI-0006", "product_id": "PROD-93D48F", "name": "RidgeLine Fleece Zip Hoodie", "quantity": 3, "unit_price": 89,
          "line_total": 267}, {"cart_item_id": "CI-0007", "product_id": "PROD-B7C77D", "name": "Metro Stretch Chino Pants",
