id: tc_1d5fbc08
description: You are Sofia Martinez (customer-support ID cust_003). You want to verify your customer profile, use your contact
  list to find Sofia Ramirez, access the shopping account for user_1d80ab67, add the LogiTech Wireless Mouse M310 to that
  cart, and confirm the updated cart total. Your customer-support profile shows a standard membership tier and a store credit
  balance of 0. The matching contact is Sofia Ramirez at +1-917-555-0148, and her shopping account currently has an empty
  cart before adding PROD-FA0948. Approve code or command from the agent if prompted
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Sofia Martinez (customer-support ID cust_003). You want  to verify your customer profile, use your
      contact list to find Sofia Ramirez, access the shopping account for user_1d80ab67, add the LogiTech Wireless Mouse M310
      to that cart, and confirm the updated cart total. Your customer-support profile shows a standard membership tier and
      a store credit balance of 0. The matching contact is Sofia Ramirez at +1-917-555-0148, and her shopping account currently
      has an empty cart before adding PROD-FA0948. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-customer-support
    - skill: toolsandbox-assistant
    - skill: state-shopping
  agent_response_validations:
  - check: The agent retrieves the customer-support profile for cust_003 and identifies Sofia Martinez as having membership
      tier standard and store credit balance 0.
  - check: The agent searches contacts using the name Sofia Martinez and finds Sofia Ramirez with person_id a2f34471-50af-42dd-b614-bbb9aff787b7
      and phone number +1-917-555-0148.
  - check: The agent accesses the shopping account user_1d80ab67 and confirms Sofia Ramirez has tier gold, loyalty_points
      0, and an empty purchase_history.
  - check: The agent adds 1 unit of PROD-FA0948, LogiTech Wireless Mouse M310, priced at 29, to cart CART-user_1d80ab67.
  - check: The agent reports that the updated cart for user_1d80ab67 has subtotal 29, discount_amount 0, and total 29 with
      no applied promo codes.
  capability_validations:
    expected_capabilities:
    - name: get_customer
      description: Retrieve customer profile including membership tier, store credit balance, and preference settings.
      output:
        check: '{"customer_id": "cust_003", "name": "Sofia Martinez", "membership_tier": "standard", "store_credit_balance":
          0, "has_prime_shipping": false, "benefits": {}}'
    - name: search_contacts
      description: Search contacts by one or more criteria. name/relationship are fuzzy-matched; person_id/phone_number/is_self
        are exact. Requires at least one criterion.
      output:
        check: '{"result": [{"person_id": "a2f34471-50af-42dd-b614-bbb9aff787b7", "name": "Sofia Ramirez", "phone_number":
          "+1-917-555-0148", "relationship": "friend", "is_self": 0}]}'
    - name: get_customer_account
      description: 'Get a customer''s account record: name, email, tier, first-time status, loyalty points, and purchase_history.'
      output:
        check: '{"customer_id": "user_1d80ab67", "name": "Sofia Ramirez", "email": "sofia.ramirez.synthetic@example.com",
          "tier": "gold", "is_first_time": false, "loyalty_points": 0, "purchase_history": []}'
    - name: add_to_cart
      description: Add a product to the customer's cart. Creates a new cart item or increments an existing one. Enforces stock
        availability and the per-product quantity limit.
      output:
        check: '{"cart_item_id": "newly generated cart item ID", "cart": {"cart_id": "CART-user_1d80ab67", "customer_id":
          "user_1d80ab67", "subtotal": 29, "discount_amount": 0, "gift_wrap_fee": 0, "loyalty_discount": 0, "loyalty_points_redeemed":
          0, "shipping_option": null, "shipping_cost": 0, "total": 29, "applied_promo_codes": [], "items": [{"product_id":
          "PROD-FA0948", "name": "LogiTech Wireless Mouse M310", "quantity": 1, "unit_price": 29, "line_total": 29}]}}'
    - name: get_cart
      description: 'Get the customer''s current cart: items with live pricing, subtotal, discount, gift-wrap fee, total, and
        applied promo codes.'
      output:
        check: '{"cart_id": "CART-user_1d80ab67", "customer_id": "user_1d80ab67", "items": [{"product_id": "PROD-FA0948",
          "name": "LogiTech Wireless Mouse M310", "quantity": 1, "unit_price": 29, "line_total": 29}], "subtotal": 29, "discount_amount":
