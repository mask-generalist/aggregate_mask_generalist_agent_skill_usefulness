      6 and total of 85.
  - check: The agent reports that Evan Parker (user_fbab7801) has 105 loyalty points, standard tier, and is_first_time 0.
  - check: The agent summarizes the cart contents using the real items LogiTech Wireless Mouse M310, Northline Wool Blend
      Throw Blanket, and CableCraft USB-C Organizer Strap 2-Pack.
  - check: The agent identifies active promotions including FALL15SAVE and PROMO0F1B01 and notes that FALL15SAVE applies to
      carts over 75 while this cart subtotal is 79.
  - check: The agent validates promo code FALL15SAVE for CART-user_fbab7801 and states that the estimated_discount is 11.85
      without claiming the promo was applied.
  capability_validations:
    expected_capabilities:
    - name: set_shipping_option
      description: Write a shipping option to the cart. Adds shipping_cost to cart.total. Calling again overwrites the prior
        value.
      output:
        check: '{"shipping_option": "standard", "shipping_cost": 6, "cart": {"cart_id": "CART-user_fbab7801", "customer_id":
