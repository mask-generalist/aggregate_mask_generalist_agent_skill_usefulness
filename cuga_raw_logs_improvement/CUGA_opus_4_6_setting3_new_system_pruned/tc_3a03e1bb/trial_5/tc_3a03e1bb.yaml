id: tc_3a03e1bb
description: 'You are Jordan Lee (user ID: jordan_lee_069). You want to exchange the
  delivered Everyday Crew Tee from order #W4669380 for another variant of the same
  product after confirming the order and product details. Your account email is jordan.lee1989@example.com,
  the original item is item_id 0924077030 in Black size S, and you want the exchange
  charged to gift_card_5581027 if there is any price difference.'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Jordan Lee (user ID: jordan_lee_069). You want to exchange
      the delivered Everyday Crew Tee from order #W4669380 for another variant of
      the same product after confirming the order and product details. Your account
      email is jordan.lee1989@example.com, the original item is item_id 0924077030
      in Black size S, and you want the exchange charged to gift_card_5581027 if there
      is any price difference.'
  max_turns: 10
  skill_validations:
    expected_skill_invocations:
    - skill: tau2Retail
  agent_response_validations:
  - check: The agent authenticates Jordan Lee by using jordan.lee1989@example.com
      and identifies user_id jordan_lee_069.
  - check: 'The agent confirms that order #W4669380 is delivered and contains the
      Everyday Crew Tee item 0924077030 in Black size S.'
  - check: The agent checks product 2460285426 and identifies item 3301828484 as an
      available Everyday Crew Tee variant in Black size M.
  - check: The agent uses gift_card_5581027 as the exchange payment method and communicates
      the price difference of 1.61.
  - check: 'The agent completes the exchange for order #W4669380 and reports the updated
      status as exchange requested.'
  capability_validations:
    expected_capabilities:
    - name: find_user_id_by_email
      description: Locate a user id by email (default authentication path).
      output:
        check: '{"user_id": "jordan_lee_069"}'
    - name: get_user_details
      description: Fetch user profile, payment methods, and order ids.
      output:
        check: '{"user_id": "jordan_lee_069", "name": "Jordan Lee", "address": {"address1":
          "512 Maple Ave", "address2": "Apt 3B", "city": "Denver", "state": "CO",
          "country": "USA", "zip": "80205"}, "email": "jordan.lee1989@example.com",
          "payment_methods": ["credit_card_3045175", "gift_card_5581027"], "orders":
          ["#W4669380"]}'
    - name: get_order_details
      description: Fetch an order by id including status, items, fulfillments, and
        payment history.
      output:
        check: '{"order_id": "#W4669380", "user_id": "jordan_lee_069", "address":
          {"address1": "512 Maple Ave", "address2": "Apt 3B", "city": "Denver", "state":
          "CO", "country": "USA", "zip": "80205"}, "items": [{"oi_id": "RT-#W4669380-0",
          "product_id": "2460285426", "item_id": "0924077030", "name": "Everyday Crew
          Tee", "quantity": 1, "unit_price": 24.99, "options": {"color": "Black",
          "size": "S"}, "item_status": "delivered"}], "status": "delivered", "fulfillments":
          [{"id": 4, "tracking_ids": ["TRK6400323333"], "item_ids": ["0924077030"],
          "created_at": "2026-09-10 17:02:00"}], "payment_history": [{"id": 4, "transaction_type":
          "payment", "amount": 24.99, "payment_method_id": "credit_card_3045175",
          "created_at": "2026-09-10 16:38:04"}]}'
    - name: get_product_details
      description: Fetch a product and its variants including options, availability,
        and prices.
      output:
        check: '{"name": "Everyday Crew Tee", "product_id": "2460285426", "variants":
          [{"item_id": "0924077030", "options": {"color": "Black", "size": "S"}, "available":
          1, "price": 21.84}, {"item_id": "3301828484", "options": {"color": "Black",
          "size": "M"}, "available": 1, "price": 23.45}, {"item_id": "9326856738",
          "options": {"color": "White", "size": "S"}, "available": 1, "price": 22.07},
          {"item_id": "6715257771", "options": {"color": "White", "size": "M"}, "available":
          1, "price": 22.07}, {"item_id": "7389318502", "options": {"color": "Black",
          "size": "L"}, "available": 1, "price": 23.91}, {"item_id": "5610875649",
          "options": {"color": "White", "size": "L"}, "available": 1, "price": 21.84}]}'
    - name: exchange_delivered_order_items
      description: Exchange items of a delivered order for other variants of the same
        product (once per order). Status becomes 'exchange requested'.
      output:
        check: '{"order_id": "#W4669380", "status": "exchange requested", "exchange_items":
          ["0924077030"], "exchange_new_items": ["3301828484"], "exchange_payment_method_id":
          "gift_card_5581027", "exchange_price_difference": 1.61}'
