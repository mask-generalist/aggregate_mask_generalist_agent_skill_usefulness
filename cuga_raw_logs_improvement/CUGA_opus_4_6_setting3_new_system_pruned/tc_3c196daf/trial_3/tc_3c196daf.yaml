id: tc_3c196daf
description: 'You are Ethan Calloway (customer ID: ethan_calloway_782). You want to return the Summit Zip Hoodie from order
  #W1203023 and then exchange the Coastal Breeze Linen Shirt in the same order for the Sky Blue, size M variant. Your order
  was delivered on 2026-09-05T14:00:00 and includes RT-#W1203023-0 priced at 64.99 and RT-#W1203023-1 priced at 44.99. You
  prefer the refund to go back to your original payment method.'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Ethan Calloway (customer ID: ethan_calloway_782). You want to return the Summit Zip Hoodie from
      order #W1203023 and then exchange the Coastal Breeze Linen Shirt in the same order for the Sky Blue, size M variant.
      Your order was delivered on 2026-09-05T14:00:00 and includes RT-#W1203023-0 priced at 64.99 and RT-#W1203023-1 priced
      at 44.99. You prefer the refund to go back to your original payment method. Approve code or command from the agent if
      prompted'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-customer-support
  agent_response_validations:
  - check: 'The agent must state that order #W1203023 for Ethan Calloway is delivered and contains the Summit Zip Hoodie (item_id
      1194810973) and Coastal Breeze Linen Shirt (item_id 2680056141).'
  - check: The agent must mention that the return refund for item_id 1194810973 is 64.99 to the original_payment method with
      0 restocking_fee and 0 paid_return_shipping_fee.
  - check: The agent must confirm that the shirt exchange changes item_id 2680056141 to new_item_id 9814539410 for the Coastal
      Breeze Linen Shirt in Sky Blue size M.
  - check: The agent must state that the exchange uses payment_method_id credit_card_5913549 and that the price_difference
      is 0 so Ethan Calloway pays 0.
  capability_validations:
    expected_capabilities:
    - name: process_return
      description: 'Process a return for an order item. Two-step operation: first call without confirm to preview the return
        (eligibility, fees, component breakdown), then call again with confirm=true and amount=<computed net refund> to execute.
        Requires prior call to get_policies(topic=''return'').'
      output:
        check: '{"status": "return_processed", "item_id": "1194810973", "refund_amount": 64.99, "refund_method": "original_payment",
          "restocking_fee": 0, "restocking_discount": 0, "shipping_clawback": 0, "bulk_clawback": 0, "repeat_surcharge": 0,
          "paid_return_shipping_fee": 0}'
    - name: get_order
      description: Retrieve full details of an order by its order ID, including all items in the order and product details
        for each item.
      output:
        check: '{"order_id": "#W1203023", "customer_id": "ethan_calloway_782", "status": "delivered", "shipping_status": "delivered",
          "items": [{"oi_id": "RT-#W1203023-0", "order_id": "#W1203023", "product_id": "6850789192", "item_id": "1194810973",
          "name": "Summit Zip Hoodie", "quantity": 1, "unit_price": 64.99, "options": "{\"color\": \"Heather Gray\", \"size\":
          \"M\"}", "item_status": "delivered"}, {"oi_id": "RT-#W1203023-1", "order_id": "#W1203023", "product_id": "2575138841",
          "item_id": "2680056141", "name": "Coastal Breeze Linen Shirt", "quantity": 1, "unit_price": 44.99, "options": "{\"color\":
          \"Sky Blue\", \"size\": \"S\"}", "item_status": "delivered"}]}'
    - name: get_policies
      description: Look up the company's policies for a given topic. Must be called before using any write tool (process_return,
        process_refund, cancel_order, process_exchange, process_warranty_claim).
      output:
        check: '{"topic": "exchange", "rules": "Exchanges require a delivered eligible item and policy review before execution."}'
    - name: process_exchange
      description: 'Exchange an item for a different product or variant. Two-step operation: first call without confirm to
        preview (price difference, eligibility), then call with confirm=true to execute. Requires prior call to get_policies(topic=''exchange'').'
      output:
        check: '{"status": "exchange_processed", "item_id": "2680056141", "new_item_id": "9814539410", "new_product_id": "2575138841",
          "price_difference": 0, "customer_pays": 0, "store_credit_refund": 0}'
