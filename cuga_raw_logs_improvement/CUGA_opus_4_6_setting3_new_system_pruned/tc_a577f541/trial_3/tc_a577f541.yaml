id: tc_a577f541
description: You are Sofia Martinez (customer ID cust_003). You want to check the cancellation policy, pull up one of your
  customer-support orders, cancel it after seeing the preview, then check the return policy and process a return for an item
  from that order, and finally text Jordan Kim at +1-646-555-0134 with an update. Your account shows preferred_refund_method
  original_payment and a Visa ending 8861. Cellular is ON on device_0, but there is no self-contact in the contacts database
  yet, so messaging will require that prerequisite to be handled before the text can be sent.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Sofia Martinez (customer ID cust_003). You want to check the cancellation policy, pull up one of
      your customer-support orders, cancel it after seeing the preview, then check the return policy and process a return
      for an item from that order, and finally text Jordan Kim at +1-646-555-0134 with an update. Your account shows preferred_refund_method
      original_payment and a Visa ending 8861. Cellular is ON on device_0, but there is no self-contact in the contacts database
      yet, so messaging will require that prerequisite to be handled before the text can be sent. Approve code or command
      from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-customer-support
    - skill: toolsandbox-assistant
  agent_response_validations:
  - check: The agent must mention that Sofia Martinez is customer ID cust_003 and that her preferred refund method is original_payment.
  - check: The agent must check a required policy before attempting a write action, and specifically reference the return
      policy topic already reflected in world_meta as ["return"].
  - check: The agent must state that cellular is ON for device_0 but that no contact has is_self = 1, so texting +1-646-555-0134
      cannot succeed until that prerequisite is addressed.
  - check: The agent must identify Jordan Kim and the phone number +1-646-555-0134 as the intended SMS recipient.
  capability_validations:
    expected_capabilities:
    - name: cancel_order
      description: 'Cancel an order or specific items within an order. Two-step operation: first call without confirm to preview
        cancellation (fees, refund), then call with confirm=true to execute. Requires prior call to get_policies(topic=''cancellation'').'
      output:
        check: '{"status": "requires prior get_policies(topic=''cancellation'')", "order_id": "cust_003", "items_cancelled":
          [], "cancellation_fee": 0, "refund_amount": 0, "refund_method": "original_payment"}'
    - name: get_order
      description: Retrieve full details of an order by its order ID, including all items in the order and product details
        for each item.
      output:
        check: '{"order_id": "cust_003", "customer_id": "cust_003", "status": "not found", "shipping_status": "not found",
          "items": []}'
    - name: get_policies
      description: Look up the company's policies for a given topic. Must be called before using any write tool (process_return,
        process_refund, cancel_order, process_exchange, process_warranty_claim).
      output:
        check: '{"topic": "return", "rules": ["return"]}'
    - name: process_return
      description: 'Process a return for an order item. Two-step operation: first call without confirm to preview the return
        (eligibility, fees, component breakdown), then call again with confirm=true and amount=<computed net refund> to execute.
        Requires prior call to get_policies(topic=''return'').'
      output:
        check: '{"status": "item not found", "item_id": "cust_003", "refund_amount": 0, "refund_method": "original_payment",
          "restocking_fee": 0, "restocking_discount": 0, "shipping_clawback": 0, "bulk_clawback": 0, "repeat_surcharge": 0,
          "paid_return_shipping_fee": 0}'
    - name: send_message_with_phone_number
      description: Send a text message to a phone number. Requires cellular ON (ConnectionError otherwise) and exactly one
        self-contact.
      output:
        check: '{"message_id": "requires self-contact before sending"}'
