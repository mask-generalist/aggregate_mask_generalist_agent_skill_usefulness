      output:
        check: '{"files": ["data/inventory.csv", "data/sales_q3.csv", "data/support_tickets.csv"]}'
    - name: get_product_details
      description: Retrieve full product details by exact product ID, including current price, stock status, warranty terms,
        and return window.
