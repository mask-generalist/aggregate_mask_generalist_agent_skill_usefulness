      output:
        check: '{"status": "exchanged", "item_id": "ITEM-E5801A", "new_item_id": "replacement item for ITEM-E5801A", "new_product_id":
          "PROD-B98D14", "price_difference": 9, "customer_pays": 0, "store_credit_refund": 9}'
    - name: edit_file
