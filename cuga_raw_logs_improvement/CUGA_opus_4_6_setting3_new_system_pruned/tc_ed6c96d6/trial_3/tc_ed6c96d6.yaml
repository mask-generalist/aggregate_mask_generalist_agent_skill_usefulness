test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Sofia Ramirez (user_1d80ab67). You want to exchange ITEM-E5801A  from order ORD-E0E671, the Aurora
      Smart Desk Lamp Pro (PROD-73FAB4), for the Anker Portable Bluetooth Speaker (PROD-B98D14). Before completing the exchange,
      you want the agent to search the workspace for a CSV file it can update, confirm the replacement product details and
      exchange policy, process the exchange preview and final confirmation, and then edit the file to record the resolved
      exchange. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: state-customer-support
  agent_response_validations:
  - check: The agent searches data for **/*.csv and identifies data/support_tickets.csv among the matching files before attempting
      any file edit.
  - check: The agent confirms that PROD-B98D14 is the Anker Portable Bluetooth Speaker priced at 79, in stock, with a 12-month
      warranty and 30-day return window.
  - check: The agent retrieves the exchange policy before processing an exchange for ITEM-E5801A from order ORD-E0E671.
  - check: The agent states that exchanging ITEM-E5801A (priced at 88) for PROD-B98D14 (priced at 79) results in a 9 refund
      and no additional customer payment.
  - check: After completing the exchange, the agent edits data/support_tickets.csv to record the resolved swap involving ITEM-E5801A,
      PROD-B98D14, and ORD-E0E671.
  capability_validations:
