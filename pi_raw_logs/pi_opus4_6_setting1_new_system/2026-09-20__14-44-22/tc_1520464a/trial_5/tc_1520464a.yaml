id: tc_1520464a
description: You are alice (alice@example.com). You want to read the Excel file skills/OfficeBench/testbed/data/order_summary.xlsx,
  have the order data summarized, and email the summary to bob@example.com. The file
  includes orders such as ORD-6C71B1 and ORD-5B048F for Maya Chen dated 2026-09-02,
  with totals 79 and 108.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to read the Excel file
      skills/OfficeBench/testbed/data/order_summary.xlsx,
      have the order data summarized, and email the summary to bob@example.com. The
      file includes orders such as ORD-6C71B1 and ORD-5B048F for Maya Chen dated 2026-09-02,
      with totals 79 and 108. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent reads skills/OfficeBench/testbed/data/order_summary.xlsx
      before composing any summary.
  - check: The agent's summary mentions both order IDs ORD-6C71B1 and ORD-5B048F and
      identifies Maya Chen as the customer.
  - check: The agent states that ORD-6C71B1 is cancelled with total paid 79 and that
      ORD-5B048F is confirmed with total paid 108.
  - check: The agent sends an email from alice@example.com to bob@example.com containing
      the generated summary.
  capability_validations:
    expected_capabilities:
    - name: read
      description: 'Read all cell values from an Excel file, returning (row, col):
        value pairs.'
      output:
        check: '{"cells": {"Orders:R1C1": "Order ID", "Orders:R1C2": "Customer", "Orders:R1C3":
          "Date", "Orders:R1C4": "Status", "Orders:R1C5": "Items", "Orders:R1C6":
          "Total Paid", "Orders:R2C1": "ORD-6C71B1", "Orders:R2C2": "Maya Chen", "Orders:R2C3":
          "2026-09-02", "Orders:R2C4": "cancelled", "Orders:R2C5": "Anker Portable
          Bluetooth Speaker", "Orders:R2C6": "79", "Orders:R3C1": "ORD-5B048F", "Orders:R3C2":
          "Maya Chen", "Orders:R3C3": "2026-09-02", "Orders:R3C4": "confirmed", "Orders:R3C5":
          "Anker Portable Bluetooth Speaker, LogiTech Wireless Mouse M310", "Orders:R3C6":
          "108"}}'
    - name: complete_text
      description: Send a prompt to the configured LLM and return the response.
      output:
        check: '{"response": "The order summary shows two orders for Maya Chen dated
          2026-09-02. Order ORD-6C71B1 was cancelled and included Anker Portable Bluetooth
          Speaker with total paid 79. Order ORD-5B048F was confirmed and included
          Anker Portable Bluetooth Speaker and LogiTech Wireless Mouse M310 with total
          paid 108."}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "sent"}'
