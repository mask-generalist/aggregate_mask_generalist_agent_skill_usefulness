id: tc_1b7908ee
description: You are alice (alice@example.com). You want to convert docs/customer_report.docx
  into a PDF and email it to bob@example.com. The document is a Customer Activity
  Report for Maya Chen and includes orders ORD-6C71B1 for $79 and ORD-5B048F for $108,
  so you want to share it after converting it.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to convert docs/customer_report.docx
      into a PDF and email it to bob@example.com. The document is a Customer Activity
      Report for Maya Chen and includes orders ORD-6C71B1 for $79 and ORD-5B048F for
      $108, so you want to share it after converting it. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent converts docs/customer_report.docx to a PDF before sending any
      email.
  - check: The agent sends an email from alice@example.com to bob@example.com.
  - check: The agent's email references Maya Chen and the Customer Activity Report.
  - check: The agent's email includes the specific order values ORD-6C71B1 for $79
      and ORD-5B048F for $108.
  capability_validations:
    expected_capabilities:
    - name: word_convert_to_pdf
      description: Convert a Word document to PDF.
      output:
        check: '{"status": "success"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "success"}'
