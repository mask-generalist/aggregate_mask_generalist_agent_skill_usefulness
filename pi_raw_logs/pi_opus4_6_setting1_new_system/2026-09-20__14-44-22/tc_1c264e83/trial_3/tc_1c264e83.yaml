id: tc_1c264e83
description: 'You are ethan.it.specialist (ethan.it.specialist@company.com). You want
  to review the email "ethan.it.specialist/High Priority: Onboarding Equipment Setup
  Needed.eml", create a calendar event to track the onboarding readiness work, and
  send a confirmation email back to olivia.hr.manager@company.com. Olivia HR Manager
  asked for a standard Windows laptop, VPN access, and email configured before start
  of business on the next business day, so you need to read her request, schedule
  the work, and confirm receipt.'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are ethan.it.specialist (ethan.it.specialist@company.com).
      You want to review the email "ethan.it.specialist/High Priority: Onboarding
      Equipment Setup Needed.eml", create a calendar event to track the onboarding
      readiness work, and send a confirmation email back to olivia.hr.manager@company.com.
      Olivia HR Manager asked for a standard Windows laptop, VPN access, and email
      configured before start of business on the next business day, so you need to
      read her request, schedule the work, and confirm receipt. Approve code or command from the agent if prompted.'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: 'The agent reads the email "ethan.it.specialist/High Priority: Onboarding
      Equipment Setup Needed.eml" for ethan.it.specialist and identifies that it came
      from olivia.hr.manager@company.com.'
  - check: 'The agent states that the request in "High Priority: Onboarding Equipment
      Setup Needed" includes a standard Windows laptop, VPN access, and email configured
      before start of business on the next business day.'
  - check: The agent creates a calendar event for ethan.it.specialist with the summary
      "Onboarding Readiness Sync — laptop, VPN/email, day-one setup" from 2026-09-09T11:00:00
      to 2026-09-09T11:30:00.
  - check: 'The agent sends a confirmation email from ethan.it.specialist to olivia.hr.manager@company.com
      using the subject "High Priority: Onboarding Equipment Setup Needed".'
  capability_validations:
    expected_capabilities:
    - name: read_email
      description: Read a specific email by its email_id (filename, e.g. Hello.eml).
      output:
        check: '{"from": "olivia.hr.manager@company.com", "to": "ethan.it.specialist@company.com",
          "subject": "High Priority: Onboarding Equipment Setup Needed", "body": "Hello
          Ethan,\n\nPlease arrange laptop setup for a newly onboarded contractor who
          is starting soon. They need a standard Windows laptop, VPN access, and email
          configured before start of business on the next business day.\n\nPlease
          prioritize this request.\n\nBest,\nOlivia\n\nTone: professional and concise"}'
    - name: create_event
      description: Add a calendar event for a user.
      output:
        check: '{"status": "success"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "success"}'
