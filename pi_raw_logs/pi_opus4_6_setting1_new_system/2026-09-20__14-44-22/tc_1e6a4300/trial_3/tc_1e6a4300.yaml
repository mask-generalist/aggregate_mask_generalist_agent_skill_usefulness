id: tc_1e6a4300
description: You are working in the OfficeBench testbed workspace. You want to extract
  the text from skills/OfficeBench/testbed/docs/handbook.pdf
  and save that extracted content into a file. The PDF contains the handbook text
  "Employee Handbook\nWelcome to the company. This handbook outlines our policies.",
  and you need it written out after reading the PDF.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are working in the OfficeBench testbed workspace. You want to
      extract the text from skills/OfficeBench/testbed/docs/handbook.pdf
      and save that extracted content into a file. The PDF contains the handbook text
      "Employee Handbook\nWelcome to the company. This handbook outlines our policies.",
      and you need it written out after reading the PDF. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent reads the PDF at skills/OfficeBench/testbed/docs/handbook.pdf
      before attempting to write any content.
  - check: The agent extracts the exact text "Employee Handbook\nWelcome to the company.
      This handbook outlines our policies." from the PDF.
  - check: The agent writes the extracted handbook text "Employee Handbook\nWelcome
      to the company. This handbook outlines our policies." to a file using the write_file
      capability.
  - check: The agent confirms that writing the content derived from skills/OfficeBench/testbed/docs/handbook.pdf
      succeeded.
  capability_validations:
    expected_capabilities:
    - name: pdf_read_file
      description: Extract text from all pages of a PDF file.
      output:
        check: '{"text": "Employee Handbook\nWelcome to the company. This handbook
          outlines our policies."}'
    - name: write
      description: Write content to a file, creating it if it does not exist or overwriting
        if it does.
      output:
        check: '{"success": true}'
