id: tc_319d68ba
description: You are Rachel Kim (E001), VP of Sales. You want to read the Q3 sales
  file and create a new workspace file containing only James Okafor's won deals from
  data/sales_q3.csv. James Okafor appears in data/employees.json as E002, and his
  won deals in the sales file include D001 for 87500, D003 for 43000, and D006 for
  120000.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Rachel Kim (E001), VP of Sales. You want to read the Q3
      sales file and create a new workspace file containing only James Okafor's won
      deals from data/sales_q3.csv. James Okafor appears in data/employees.json as
      E002, and his won deals in the sales file include D001 for 87500, D003 for 43000,
      and D006 for 120000. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent reads data/sales_q3.csv before creating the filtered output.
  - check: The agent identifies that James Okafor's won deals are D001 for 87500,
      D003 for 43000, and D006 for 120000.
  - check: The agent writes a file containing only the header and the three James
      Okafor won rows, excluding Sofia Delgado and Marcus Webb rows.
  - check: The agent confirms the write succeeded after saving the filtered content
      to docs/q3_report.md.
  capability_validations:
    expected_capabilities:
    - name: read
      description: Read file contents from workspace, optionally filtering by line
        range or regex pattern.
      output:
        check: '{"content": "deal_id,rep_name,region,product,amount,close_date,status\nD001,James
          Okafor,North,Meridian Insights Pro,87500,2026-07-05,won\nD002,Sofia Delgado,South,Meridian
          Insights Pro,62000,2026-07-08,won\nD003,James Okafor,East,Meridian DataBridge,43000,2026-07-12,won\nD004,Marcus
          Webb,West,Meridian Insights Lite,9500,2026-07-15,lost\nD005,Sofia Delgado,North,Meridian
          DataBridge,55000,2026-07-19,won\nD006,James Okafor,South,Meridian Insights
          Pro,120000,2026-07-22,won\nD007,Marcus Webb,East,Meridian Insights Lite,7800,2026-07-28,pending\nD008,Sofia
          Delgado,West,Meridian DataBridge,38000,2026-08-02,won"}'
    - name: write
      description: Write content to a file, creating it if it does not exist or overwriting
        if it does.
      output:
        check: '{"success": true}'
