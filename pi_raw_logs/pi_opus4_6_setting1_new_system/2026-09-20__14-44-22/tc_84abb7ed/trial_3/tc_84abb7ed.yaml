id: tc_84abb7ed
description: You are Rachel Kim. You want to look up the travel cancellation policy
  and save it into a workspace file for the Executive Team. While preparing the Q3
  2026 Business Report for the period July 1 – September 7, 2026, you want the policy
  written into docs/q3_report.md so it is available alongside Meridian Analytics materials.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Rachel Kim. You want to look up the travel cancellation
      policy and save it into a workspace file for the Executive Team. While preparing
      the Q3 2026 Business Report for the period July 1 – September 7, 2026, you want
      the policy written into docs/q3_report.md so it is available alongside Meridian
      Analytics materials. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-travel
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent states that it retrieved the travel policy for the topic "cancel"
      for Rachel Kim.
  - check: The agent writes content to docs/q3_report.md in the workspace.
  - check: The agent confirms the file write succeeded and references docs/q3_report.md.
  - check: The agent’s response includes context tied to Meridian Analytics or the
      Q3 2026 Business Report.
  capability_validations:
    expected_capabilities:
    - name: get_policies
      description: 'Look up travel policies for a specific topic. Topics: cancel,
        change, baggage, delay_compensation, loyalty, upgrade, hotel_cancel, car_rental_cancel.'
      output:
        check: '{"topic": "cancel", "rules": "cancellation rules by cabin class and
          route type"}'
    - name: write
      description: Write content to a file, creating it if it does not exist or overwriting
        if it does.
      output:
        check: '{"success": true}'
