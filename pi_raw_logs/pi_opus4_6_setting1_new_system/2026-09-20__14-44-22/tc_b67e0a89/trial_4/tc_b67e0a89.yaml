id: tc_b67e0a89
description: 'You are alice (alice@example.com). You want to draft and send an email
  to bob (bob@example.com) about the onboarding equipment setup request in the message
  "High Priority: Onboarding Equipment Setup Needed". Use the details from olivia.hr.manager@company.com
  to ethan.it.specialist@company.com, including the need for a standard Windows laptop,
  VPN access, and email configured before start of business on the next business day.'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are alice (alice@example.com). You want to draft and send an
      email to bob (bob@example.com) about the onboarding equipment setup request
      in the message "High Priority: Onboarding Equipment Setup Needed". Use the details
      from olivia.hr.manager@company.com to ethan.it.specialist@company.com, including
      the need for a standard Windows laptop, VPN access, and email configured before
      start of business on the next business day. Approve code or command from the agent if prompted.'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: 'The agent drafts email content using the onboarding request text from
      "High Priority: Onboarding Equipment Setup Needed".'
  - check: The agent sends the email from alice to bob@example.com.
  - check: 'The agent uses the subject "High Priority: Onboarding Equipment Setup
      Needed" in the sent email.'
  - check: 'The agent includes the specific setup requirements: standard Windows laptop,
      VPN access, and email configured before start of business on the next business
      day.'
  capability_validations:
    expected_capabilities:
    - name: complete_text
      description: Send a prompt to the configured LLM and return the response.
      output:
        check: '{"response": "Hello Ethan,\n\nPlease arrange laptop setup for a newly
          onboarded contractor who is starting soon. They need a standard Windows
          laptop, VPN access, and email configured before start of business on the
          next business day.\n\nPlease prioritize this request.\n\nBest,\nOlivia"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "sent"}'
