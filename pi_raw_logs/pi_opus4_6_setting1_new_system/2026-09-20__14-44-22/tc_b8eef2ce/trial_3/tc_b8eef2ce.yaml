id: tc_b8eef2ce
description: You are Rachel Kim (E001), VP of Sales. You want to look up the travel
  cancellation policy and save it to a workspace file for later reference. Your employee
  record in data/employees.json lists your email as r.kim@meridiananalytics.io, and
  you want the policy written into the existing docs/ directory.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Rachel Kim (E001), VP of Sales. You want to look up the
      travel cancellation policy and save it to a workspace file for later reference.
      Your employee record in data/employees.json lists your email as r.kim@meridiananalytics.io,
      and you want the policy written into the existing docs/ directory. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-travel
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent identifies the requester as Rachel Kim (E001) and addresses the
      request as saving a travel cancellation policy.
  - check: The agent retrieves the cancel policy and includes the returned topic value
      "cancellation" and the rule with the amount $50.
  - check: The agent writes the retrieved cancellation policy content to docs/cancel.md.
  - check: The agent confirms the file write succeeded and preserves the policy text
      containing $75 and 20% of ticket price.
  capability_validations:
    expected_capabilities:
    - name: get_policies
      description: 'Look up travel policies for a specific topic. Topics: cancel,
        change, baggage, delay_compensation, loyalty, upgrade, hotel_cancel, car_rental_cancel.'
      output:
        check: '{"topic": "cancellation", "rules": {"free_cancellation_window": "Full
          refund within 24 hours (domestic) or 48 hours (international) of booking",
          "basic_economy": "Not cancellable after free window (unless insured)", "economy_domestic":
          "Cancellation fee: max($50, 15% of ticket price)", "economy_international":
          "Cancellation fee: max($75, 20% of ticket price)"}}'
    - name: write
      description: Write content to a file, creating it if it does not exist or overwriting
        if it does.
      output:
        check: '{"success": true}'
