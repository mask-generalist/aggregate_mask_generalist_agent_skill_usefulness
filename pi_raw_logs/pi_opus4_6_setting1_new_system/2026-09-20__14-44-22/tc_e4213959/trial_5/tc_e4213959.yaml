id: tc_e4213959
description: You are alice (alice@example.com). You want to convert docs/customer_report.docx
  to a PDF and email it to bob@example.com. The document is a customer activity report
  for Maya Chen and includes order ORD-6C71B1 from 2026-09-02 with a total of $79,
  so you want to share it with bob after converting it.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to convert docs/customer_report.docx
      to a PDF and email it to bob@example.com. The document is a customer activity
      report for Maya Chen and includes order ORD-6C71B1 from 2026-09-02 with a total
      of $79, so you want to share it with bob after converting it. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent converts the Word file at docs/customer_report.docx to a PDF
      before sending any email.
  - check: The agent sends the email from alice to bob, corresponding to alice@example.com
      and bob@example.com.
  - check: The agent's email mentions Maya Chen and order ORD-6C71B1.
  - check: The agent's email references the 2026-09-02 order date and the $79 total
      from the report.
  capability_validations:
    expected_capabilities:
    - name: word_convert_to_pdf
      description: Convert a Word document to PDF.
      output:
        check: '{"status": "success"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "success"}'
