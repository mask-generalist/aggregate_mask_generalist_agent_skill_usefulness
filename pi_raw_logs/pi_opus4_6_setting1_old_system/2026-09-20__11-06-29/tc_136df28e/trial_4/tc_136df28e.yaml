id: tc_136df28e
description: You are Rachel Kim (E001), VP of Sales. You want to read the Q3 sales
  CSV, identify the won deals for James Okafor, and write a short summary file for
  leadership. Use the deal details from data/sales_q3.csv, including D001, D003, and
  D006, and save the summary as docs/q3_report.md for the Executive Team.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Rachel Kim (E001), VP of Sales. You want to read the Q3
      sales CSV, identify the won deals for James Okafor, and write a short summary
      file for leadership. Use the deal details from data/sales_q3.csv, including
      D001, D003, and D006, and save the summary as docs/q3_report.md for the Executive
      Team. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent reads data/sales_q3.csv before writing any summary.
  - check: The agent identifies that James Okafor is associated with won deals D001,
      D003, and D006.
  - check: The agent includes the exact amounts $87500, $43000, and $120000 in the
      written summary.
  - check: The agent writes the summary to docs/q3_report.md and confirms the write
      succeeded.
  capability_validations:
    expected_capabilities:
    - name: read
      description: Read file contents from workspace, optionally filtering by line
        range or regex pattern.
      output:
        check: '{"content": "deal_id,rep_name,region,product,amount,close_date,status\nD001,James
          Okafor,North,Meridian Insights Pro,87500,2026-07-05,won\nD002,Sofia Delgado,South,Meridian
          Insights Pro,62000,2026-07-08,won\nD003,James Okafor,East,Meridian DataBridge,43000,2026-07-12,won\nD004,Marcus
          Webb,West,Meridian Insights Lite,9500,2026-07-15,lost\nD005,Sofia Delgado,North,Meridian
          DataBridge,55000,2026-07-19,won\nD006,James Okafor,South,Meridian Insights
          Pro,120000,2026-07-22,won"}'
    - name: write
      description: Write content to a file, creating it if it does not exist or overwriting
        if it does.
      output:
        check: '{"success": true}'
