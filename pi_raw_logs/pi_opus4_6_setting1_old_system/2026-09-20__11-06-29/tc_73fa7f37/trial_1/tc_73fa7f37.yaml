id: tc_73fa7f37
description: You are Elena Marquez (user_59b22691). You want to review your existing
  flight booking BK-B70889, check the flight change policy, and then update that booking
  on the same flight. Your current booking is on flight FL658038 in business class
  with an aisle seat and you paid $1180, so you want the agent to confirm the booking
  details, look up the change rules, and then change your seat type from aisle to
  window.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Elena Marquez (user_59b22691). You want to review your existing
      flight booking BK-B70889, check the flight change policy, and then update that
      booking on the same flight. Your current booking is on flight FL658038 in business
      class with an aisle seat and you paid $1180, so you want the agent to confirm
      the booking details, look up the change rules, and then change your seat type
      from aisle to window. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-travel
  agent_response_validations:
  - check: The agent retrieves booking BK-B70889 and tells Elena Marquez that it belongs
      to user_59b22691, is on flight FL658038, and is currently confirmed.
  - check: The agent states that booking BK-B70889 is in business class with an aisle
      seat and that the price paid was $1180.
  - check: The agent looks up the change policy using the topic change and explains
      that confirmed bookings can be changed and same-flight edits only require passing
      the fields being changed.
  - check: The agent updates booking BK-B70889 from seat_type aisle to seat_type window
      without changing the flight FL658038.
  - check: The agent confirms the update for BK-B70889 remained confirmed and reports
      change_fee 0, fare_difference 0, and new_total 1180.
  capability_validations:
    expected_capabilities:
    - name: get_booking
      description: Retrieve the details of an existing booking by its booking ID.
      output:
        check: '{"booking_id": "BK-B70889", "user_id": "user_59b22691", "flight_id":
          "FL658038", "cabin_class": "business", "seat_type": "aisle", "status": "confirmed",
          "price_paid": 1180}'
    - name: get_policies
      description: 'Look up travel policies for a specific topic. Topics: cancel,
        change, baggage, delay_compensation, loyalty, upgrade, hotel_cancel, car_rental_cancel.'
      output:
        check: '{"topic": "change", "rules": "Flight changes are allowed for confirmed
          bookings. For same-flight edits, only the fields being changed should be
          passed. For flight changes, pass confirm=false first to preview fees, then
          confirm=true to execute."}'
    - name: update_booking
      description: Update an existing booking. Only pass fields to change for same-flight
        edits. For flight changes, pass confirm=false first to preview fees, then
        confirm=true to execute.
      output:
        check: '{"booking_id": "BK-B70889", "status": "confirmed", "change_fee": 0,
          "fare_difference": 0, "new_total": 1180}'
