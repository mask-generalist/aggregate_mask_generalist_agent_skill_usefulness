id: tc_910e9954
description: You are alice@example.com. You want to read the contents of the existing
  email file skills/OfficeBench/testbed/emails/alice/Hello.eml
  and then send that exact message on to carol@example.com. The file shows a message
  from bob@example.com with the subject Hello and the body Hi Alice, just checking
  in!, which should be used when sending the new email.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice@example.com. You want to read the contents of the
      existing email file skills/OfficeBench/testbed/emails/alice/Hello.eml
      and then send that exact message on to carol@example.com. The file shows a message
      from bob@example.com with the subject Hello and the body Hi Alice, just checking
      in!, which should be used when sending the new email. Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent reads skills/OfficeBench/testbed/emails/alice/Hello.eml
      before composing the outgoing email.
  - check: The agent identifies that the file contains the subject Hello from bob@example.com
      to alice@example.com.
  - check: The agent sends an email from alice@example.com to carol@example.com with
      the subject Hello.
  - check: The agent uses the exact body text Hi Alice, just checking in! as the email
      content when sending to carol@example.com.
  capability_validations:
    expected_capabilities:
    - name: read
      description: Read file contents from workspace, optionally filtering by line
        range or regex pattern.
      output:
        check: '{"content": "From: bob@example.com\nTo: alice@example.com\nSubject:
          Hello\nContent-Type: text/plain; charset=\"utf-8\"\nContent-Transfer-Encoding:
          7bit\nMIME-Version: 1.0\n\nHi Alice, just checking in!"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "sent"}'
