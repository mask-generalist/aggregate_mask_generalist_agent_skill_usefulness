judge:
  model: azure/gpt-5.4
  max_tokens: 4096
  num_judge_trials: 5

# Trace converter (REQUIRED). stream = fixes truncation; legacy = truncated.
trace_converter: stream # stream or legacy

user_proxy:
  model: azure/gpt-4.1
  max_tokens: 4096
  use_expert_agent: true

# Pi gateway (docker-pi/pi_server.py) connection + per-trial workspace.
pi:
  base_url: http://localhost:8000
  ask_timeout: 600
  # workspace_template: experiment_runner/env   # default: the materialized Pi-ready template
  # workspace_root: /abs/path                    # default: experiment_clean/pi_workspaces

# Skills whitelist: controls which skills CUGA sees (others get SKILL.md.off)
# and which expected skills are used for precision/recall during evaluation.
# Set to true to enable, false to disable. Remove the section entirely to
# use all skills in .cuga/skills/.
skills:
  tau2Airline: false
  tau2Retail: false
  OfficeBench: true
  state-customer-support: false
  state-shopping: false
  state-travel: false
  toolsandbox-assistant: false
