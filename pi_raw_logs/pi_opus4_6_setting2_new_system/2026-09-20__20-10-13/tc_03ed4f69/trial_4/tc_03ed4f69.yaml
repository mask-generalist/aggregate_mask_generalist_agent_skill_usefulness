id: tc_03ed4f69
description: You are Maya Chen. You want to review the Excel order data in data/order_summary.xlsx,
  generate a short analysis of your orders, and save that analysis into a new Word
  document. The spreadsheet includes order ORD-6C71B1 for $79.0 with status cancelled
  and order ORD-5B048F for $108.0 with status confirmed, both dated 2026-09-02.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Maya Chen. You want to review the Excel order data in data/order_summary.xlsx,
      generate a short analysis of your orders, and save that analysis into a new
      Word document. The spreadsheet includes order ORD-6C71B1 for $79.0 with status
      cancelled and order ORD-5B048F for $108.0 with status confirmed, both dated
      2026-09-02.
      Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent lists Excel files in data and identifies data/order_summary.xlsx
      among the results.
  - check: The agent reads data/order_summary.xlsx and uses the rows for Maya Chen
      containing ORD-6C71B1 and ORD-5B048F.
  - check: The agent's generated analysis mentions that ORD-6C71B1 was cancelled for
      79.0 and ORD-5B048F was confirmed for 108.0.
  - check: The agent creates or uses docs/customer_report.docx and writes the generated
      summary about Maya Chen into that Word document.
  capability_validations:
    expected_capabilities:
    - name: bash
      description: List files in a directory, optionally filtered by glob pattern.
      output:
        check: '{"files": ["data/order_summary.xlsx", "data/travel_expenses.xlsx",
          "data/product_inventory.xlsx"]}'
    - name: read
      description: 'Read all cell values from an Excel file, returning (row, col):
        value pairs.'
      output:
        check: '{"cells": {"Orders:R1C1": "Order ID", "Orders:R1C2": "Customer", "Orders:R1C3":
          "Date", "Orders:R1C4": "Status", "Orders:R1C5": "Items", "Orders:R1C6":
          "Total Paid", "Orders:R2C1": "ORD-6C71B1", "Orders:R2C2": "Maya Chen", "Orders:R2C3":
          "2026-09-02", "Orders:R2C4": "cancelled", "Orders:R2C5": "Anker Portable
          Bluetooth Speaker", "Orders:R2C6": "79.0", "Orders:R3C1": "ORD-5B048F",
          "Orders:R3C2": "Maya Chen", "Orders:R3C3": "2026-09-02", "Orders:R3C4":
          "confirmed", "Orders:R3C5": "Anker Portable Bluetooth Speaker, LogiTech
          Wireless Mouse M310", "Orders:R3C6": "108.0"}}'
    - name: complete_text
      description: Send a prompt to the configured LLM and return the response.
      output:
        check: '{"response": "Maya Chen has two orders in data/order_summary.xlsx
          dated 2026-09-02. Order ORD-6C71B1 was cancelled and totaled $79.0 for Anker
          Portable Bluetooth Speaker. Order ORD-5B048F was confirmed and totaled $108.0
          for Anker Portable Bluetooth Speaker and LogiTech Wireless Mouse M310."}'
    - name: word_create_new_file
      description: Create a new empty Word document.
      output:
        check: '{"status": "created docs/customer_report.docx"}'
    - name: write_to_file
      description: Append text to a Word document with optional style.
      output:
        check: '{"status": "appended to docs/customer_report.docx"}'
