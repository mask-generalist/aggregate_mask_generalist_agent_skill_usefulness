id: tc_6536aad4
description: You are alice (alice@example.com). You want to read the order summary
  file at data/order_summary.xlsx and email the order details to bob@example.com.
  The file contains order ORD-6C71B1 for Maya Chen dated 2026-09-02 with status cancelled
  and total paid 79.0, and you want that content sent by email.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to read the order summary
      file at data/order_summary.xlsx and email the order details to bob@example.com.
      The file contains order ORD-6C71B1 for Maya Chen dated 2026-09-02 with status
      cancelled and total paid 79.0, and you want that content sent by email.
      Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent reads the file data/order_summary.xlsx before sending any email.
  - check: The agent includes the order ID ORD-6C71B1 and customer name Maya Chen
      in the email content sent from alice@example.com to bob@example.com.
  - check: The agent includes the date 2026-09-02, status cancelled, and total paid
      79.0 from the order summary in the email body.
  - check: The agent sends the email from alice@example.com to bob@example.com with
      a subject referencing ORD-6C71B1.
  capability_validations:
    expected_capabilities:
    - name: read
      description: Read file contents from workspace, optionally filtering by line
        range or regex pattern.
      output:
        check: '{"content": "Order ID,Customer,Date,Status,Items,Total Paid\nORD-6C71B1,Maya
          Chen,2026-09-02,cancelled,Anker Portable Bluetooth Speaker,79.0"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "sent"}'
