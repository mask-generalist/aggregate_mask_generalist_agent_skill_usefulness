id: tc_bdfd86c3
description: You are Maya Chen. You want to find the Excel inventory file, read data
  from data/product_inventory.xlsx, generate a short inventory summary, and save it
  into a new Word document. The inventory includes products such as PROD-B98D14 Anker
  Portable Bluetooth Speaker priced at 79.0 and PROD-FA0948 LogiTech Wireless Mouse
  M310 priced at 29.0. You also want the saved summary to mention that all listed
  items are marked In Stock as Yes.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Maya Chen. You want to find the Excel inventory file, read
      data from data/product_inventory.xlsx, generate a short inventory summary, and
      save it into a new Word document. The inventory includes products such as PROD-B98D14
      Anker Portable Bluetooth Speaker priced at 79.0 and PROD-FA0948 LogiTech Wireless
      Mouse M310 priced at 29.0. You also want the saved summary to mention that all
      listed items are marked In Stock as Yes.
      Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent must identify data/product_inventory.xlsx from the listed .xlsx
      files before reading the inventory data.
  - check: The agent must read and use specific inventory values including PROD-B98D14
      Anker Portable Bluetooth Speaker 79.0 and PROD-FA0948 LogiTech Wireless Mouse
      M310 29.0.
  - check: The agent must generate a summary that mentions both electronics and kitchen
      products, including OXO SoftWorks 3-Piece Mixing Bowl Set and ThermoPro Digital
      Meat Thermometer.
  - check: The agent must state that all products in data/product_inventory.xlsx have
      In Stock listed as Yes.
  - check: The agent must create and write the generated inventory summary into docs/customer_report.docx.
  capability_validations:
    expected_capabilities:
    - name: bash
      description: List files in a directory, optionally filtered by glob pattern.
      output:
        check: '{"files": ["data/product_inventory.xlsx"]}'
    - name: read
      description: 'Read all cell values from an Excel file, returning (row, col):
        value pairs.'
      output:
        check: '{"cells": {"Inventory:R1C1": "Product ID", "Inventory:R1C2": "Name",
          "Inventory:R1C3": "Category", "Inventory:R1C4": "Price", "Inventory:R1C5":
          "In Stock", "Inventory:R2C1": "PROD-B98D14", "Inventory:R2C2": "Anker Portable
          Bluetooth Speaker", "Inventory:R2C3": "electronics", "Inventory:R2C4": "79.0",
          "Inventory:R2C5": "Yes", "Inventory:R3C1": "PROD-FA0948", "Inventory:R3C2":
          "LogiTech Wireless Mouse M310", "Inventory:R3C3": "electronics", "Inventory:R3C4":
          "29.0", "Inventory:R3C5": "Yes", "Inventory:R4C1": "PROD-2DBA15", "Inventory:R4C2":
          "Wireless Ergonomic Mouse", "Inventory:R4C3": "electronics", "Inventory:R4C4":
          "39.0", "Inventory:R4C5": "Yes", "Inventory:R5C1": "PROD-3E35A7", "Inventory:R5C2":
          "OXO SoftWorks 3-Piece Mixing Bowl Set", "Inventory:R5C3": "kitchen", "Inventory:R5C4":
          "42.0", "Inventory:R5C5": "Yes", "Inventory:R6C1": "PROD-B416AA", "Inventory:R6C2":
          "ThermoPro Digital Meat Thermometer", "Inventory:R6C3": "kitchen", "Inventory:R6C4":
          "26.0", "Inventory:R6C5": "Yes"}}'
    - name: complete_text
      description: Send a prompt to the configured LLM and return the response.
      output:
        check: '{"response": "Inventory summary: data/product_inventory.xlsx contains
          five products. Electronics items are PROD-B98D14 Anker Portable Bluetooth
          Speaker priced at 79.0, PROD-FA0948 LogiTech Wireless Mouse M310 priced
          at 29.0, and PROD-2DBA15 Wireless Ergonomic Mouse priced at 39.0. Kitchen
          items are PROD-3E35A7 OXO SoftWorks 3-Piece Mixing Bowl Set priced at 42.0
          and PROD-B416AA ThermoPro Digital Meat Thermometer priced at 26.0. All items
          are marked In Stock as Yes."}'
    - name: word_create_new_file
      description: Create a new empty Word document.
      output:
        check: '{"status": "created docs/customer_report.docx"}'
    - name: write_to_file
      description: Append text to a Word document with optional style.
      output:
        check: '{"status": "appended to docs/customer_report.docx"}'
