id: tc_3e2c320d
description: 'You are Emma Chen (user_id: cust_001, email: emma.chen@example.com). You want to turn off your phone''s cellular
  service, look up your friend Maya Bennett, then authenticate your retail account by email so your customer profile and the
  return policy can be checked. Your account has a state-customer-support profile with platinum membership and a store credit
  balance of 150, and you want the agent to use emma.chen@example.com during authentication. Approve code or command from
  the agent if prompted'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Emma Chen (user_id: cust_001, email: emma.chen@example.com).  You want to turn off your phone''s
      cellular service, look up your friend Maya Bennett, then authenticate your retail account by email so your customer
      profile and the return policy can be checked. Your account has a state-customer-support profile with platinum membership
      and a store credit balance of 150, and you want the agent to use emma.chen@example.com during authentication. Approve
      code or command from the agent if prompted'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: toolsandbox-assistant
    - skill: tau2Retail
    - skill: state-customer-support
  agent_response_validations:
  - check: The agent turns cellular service off successfully because device_0 currently has cellular set to 1 and low_battery_mode
      set to 0.
  - check: The agent searches contacts for Maya Bennett and identifies person_id 2886d614-b329-4b5b-9bae-aedf8a1fff0d with
      phone number +1-415-555-0187.
  - check: The agent attempts tau2Retail authentication using emma.chen@example.com and recognizes that no tau2Retail user_id
      is returned for Emma Chen.
  - check: The agent still reports the available state-customer-support profile for Emma Chen as customer_id cust_001 with
      platinum membership and store_credit_balance 150.
  - check: The agent checks the return policy topic and references the requested topic value return before explaining the
      chain is blocked at tau2Retail authentication.
  capability_validations:
    expected_capabilities:
    - name: set_cellular_service_status
      description: Toggle cellular service on or off. Raises ValueError if already in the requested state; raises PermissionError
        if low-battery mode is on.
      output:
        check: '{"result": "Cellular service disabled."}'
    - name: search_contacts
      description: Search contacts by one or more criteria. name/relationship are fuzzy-matched; person_id/phone_number/is_self
        are exact. Requires at least one criterion.
      output:
        check: '{"result": [{"person_id": "2886d614-b329-4b5b-9bae-aedf8a1fff0d", "name": "Maya Bennett", "phone_number":
          "+1-415-555-0187", "relationship": "friend", "is_self": 0, "created_at": "2026-09-01T10:00:00"}]}'
    - name: find_user_id_by_email
      description: Locate a user id by email (default authentication path).
      output:
        check: '{"user_id": ""}'
    - name: get_customer
      description: Retrieve customer profile including membership tier, store credit balance, and preference settings.
      output:
        check: '{"customer_id": "cust_001", "name": "Emma Chen", "membership_tier": "platinum", "store_credit_balance": 150,
          "has_prime_shipping": false, "benefits": []}'
    - name: get_policies
      description: Look up the company's policies for a given topic. Must be called before using any write tool (process_return,
        process_refund, cancel_order, process_exchange, process_warranty_claim).
      output:
        check: '{"topic": "return", "rules": ["Return policy rules for return"]}'
