  - check: The agent notes that FALL15SAVE does not meet the current cart threshold because the subtotal is $68 and the promotion
      requires $75.
  - check: The agent states that redeeming 500 loyalty points for user_775b12d6 applies a $5 discount and reduces the cart
      total from $74 to $69.
