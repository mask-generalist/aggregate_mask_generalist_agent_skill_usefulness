      output:
        check: '{"cart_id": "CART-user_775b12d6", "customer_id": "user_775b12d6", "items": [{"cart_item_id": "CI-0004", "product_id":
          "PROD-9559B3", "name": "Bamboo Desk Organizer Set", "quantity": 2, "unit_price": 34, "gift_wrap": 0, "variant_id":
          null}], "subtotal": 68, "discount_amount": 0, "gift_wrap_fee": 0, "total": 74, "applied_promo_codes": [], "loyalty_points_redeemed":
          0, "loyalty_discount": 0, "shipping_option": "standard", "shipping_cost": 6}'
    - name: get_customer_account
      description: 'Get a customer''s account record: name, email, tier, first-time status, loyalty points, and purchase_history.'
      output:
        check: '{"customer_id": "user_775b12d6", "name": "Jordan Alvarez", "email": "jordan.alvarez@example.com", "tier":
          "gold", "is_first_time": false, "loyalty_points": 7181, "purchase_history": []}'
    - name: get_promotions
      description: List currently active, non-expired promotions. Optional category filter restricts to promos applicable
        to that category.
      output:
        check: '{"promotions": [{"promo_code": "PROMO0F1B01", "description": "Summer sale", "discount_type": "percentage",
