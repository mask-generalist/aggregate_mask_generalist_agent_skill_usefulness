id: tc_b3cad82e
description: You are the user of device_0. You want to get your current location and save it to a file in the workspace. Your
  device settings show location_service is enabled on device_0, and the current coordinates available are 37.7749 and -122.4194.
  Use those exact coordinates when writing the file content. Approve code or command from the agent if prompted
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are the user of device_0. You want to get your current location  and save it to a file in the workspace.
      Your device settings show location_service is enabled on device_0, and the current coordinates available are 37.7749
      and -122.4194. Use those exact coordinates when writing the file content. Approve code or command from the agent if
      prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: toolsandbox-assistant
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent must retrieve the current location for device_0 and obtain latitude 37.7749.
  - check: The agent must retrieve the current location for device_0 and obtain longitude -122.4194.
  - check: The agent must write file content that includes both 37.7749 and -122.4194.
  - check: The agent must indicate that the file write succeeded after using the location from device_0.
  capability_validations:
    expected_capabilities:
    - name: get_current_location
      description: Get the device's current latitude and longitude. Raises PermissionError when location service is OFF.
      output:
        check: '{"latitude": 37.7749, "longitude": -122.4194}'
    - name: write
      description: Write content to a file, creating it if it does not exist or overwriting if it does.
      output:
        check: '{"success": true}'
