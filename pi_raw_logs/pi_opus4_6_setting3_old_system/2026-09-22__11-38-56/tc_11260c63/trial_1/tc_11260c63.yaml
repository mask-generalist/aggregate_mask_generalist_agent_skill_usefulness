id: tc_11260c63
description: You are Emma Chen (cust_001). You want to see the full list of available product types, check details for PROD-B98D14,
  review the company's exchange policy, and then try to find your orders so you can exchange an item for PROD-FA0948. You
  are a platinum customer with store credit balance 150, and you want the agent to determine whether an exchange is possible
  even if no eligible delivered order is found. Approve code or command from the agent if prompted
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Emma Chen (cust_001). You want to see the full list of available  product types, check details for
      PROD-B98D14, review the company's exchange policy, and then try to find your orders so you can exchange an item for
      PROD-FA0948. You are a platinum customer with store credit balance 150, and you want the agent to determine whether
      an exchange is possible even if no eligible delivered order is found. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: tau2Retail
    - skill: state-customer-support
  agent_response_validations:
  - check: The agent should list available product types including Anker Portable Bluetooth Speaker mapped to PROD-B98D14
      and LogiTech Wireless Mouse M310 mapped to PROD-FA0948.
  - check: The agent should report that PROD-B98D14 is Anker Portable Bluetooth Speaker priced at 79, in stock, with a 12-month
      warranty and 30-day return window.
  - check: The agent should explicitly check the exchange policy by calling get_policies with topic exchange before attempting
      process_exchange.
  - check: The agent should make clear that Emma Chen (cust_001) has no orders and therefore cannot complete an exchange into
      PROD-FA0948.
  capability_validations:
    expected_capabilities:
    - name: list_all_product_types
      description: Returns a JSON string mapping product names to product ids (50 product types).
      output:
        check: '{"product_map": "{\"Anker Portable Bluetooth Speaker\":\"PROD-B98D14\",\"LogiTech Wireless Mouse M310\":\"PROD-FA0948\",\"Aurora
          Smart Desk Lamp Pro\":\"PROD-73FAB4\",\"Wireless Mouse\":\"PROD-7C0240\",\"RidgeLine Fleece Zip Hoodie\":\"PROD-93D48F\",\"OXO
          SoftWorks 3-Piece Mixing Bowl Set\":\"PROD-3E35A7\",\"Everyday Canvas Tote Bag\":\"PROD-4ED2E3\",\"Bamboo Desk Organizer
          Set\":\"PROD-9559B3\",\"TrailPeak Insulated Travel Mug\":\"PROD-AFC284\"}"}'
    - name: get_product_details
      description: Retrieve full product details by exact product ID, including current price, stock status, warranty terms,
        and return window.
      output:
        check: '{"product_id": "PROD-B98D14", "name": "Anker Portable Bluetooth Speaker", "category": "electronics", "price":
          79, "in_stock": true, "warranty_months": 12, "return_window_days": 30}'
    - name: get_policies
      description: Look up the company's policies for a given topic. Must be called before using any write tool (process_return,
        process_refund, cancel_order, process_exchange, process_warranty_claim).
      output:
        check: '{"topic": "exchange", "rules": "Exchange policy rules for topic ''exchange''."}'
    - name: get_customer
      description: Retrieve customer profile including membership tier, store credit balance, and preference settings.
      output:
        check: '{"customer_id": "cust_001", "name": "Emma Chen", "loyalty_tier": "platinum", "store_credit_balance": 150}'
