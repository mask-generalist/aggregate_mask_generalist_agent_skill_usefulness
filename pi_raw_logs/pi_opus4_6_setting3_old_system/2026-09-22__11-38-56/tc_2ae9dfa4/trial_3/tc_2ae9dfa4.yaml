    - skill: state-shopping
    - skill: toolsandbox-assistant
  agent_response_validations:
  - check: The agent updates cart item CI-0006 from quantity 3 to quantity 2 for Caleb Foster in CART-user_58b0a2d6.
  - check: The agent removes CI-0005 from CART-user_58b0a2d6 and reports the updated total as 322.
  - check: The agent provides shipping information for the updated cart only after the user explicitly asks, and references
      the updated cart after removing CI-0005.
  - check: The agent retrieves the returns policy and mentions that RidgeLine Fleece Zip Hoodie and Metro Stretch Chino Pants
      have a 30-day return window with a restocking fee of 0.
  - check: The agent does not claim to have texted Maya Bennett at +1-415-555-0187 successfully because there is no self-contact
      in ts_contacts even though cellular is ON on device_0.
