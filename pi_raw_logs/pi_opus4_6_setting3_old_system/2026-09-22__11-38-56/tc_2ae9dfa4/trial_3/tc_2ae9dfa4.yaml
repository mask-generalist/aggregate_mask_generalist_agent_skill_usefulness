          window of 30 days and a restocking fee of 0.", "Metro Stretch Chino Pants has a return window of 30 days and a restocking
          fee of 0."]}'
    - name: send_message_with_phone_number
      description: Send a text message to a phone number. Requires cellular ON (ConnectionError otherwise) and exactly one
        self-contact.
      output:
        check: '{"message_id": "requires exactly one self-contact before sending"}'
