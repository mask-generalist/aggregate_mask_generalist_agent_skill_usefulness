test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Caleb Foster (user_58b0a2d6). You want to update your cart  by changing CI-0006, remove CI-0005,
      check shipping options for the updated CART-user_58b0a2d6, review the store's returns policy, and then text Maya Bennett
