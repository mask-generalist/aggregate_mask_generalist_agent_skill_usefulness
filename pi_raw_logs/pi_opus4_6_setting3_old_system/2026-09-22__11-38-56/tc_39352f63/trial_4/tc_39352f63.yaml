id: tc_39352f63
description: You are Maya Chen (customer/account ID user_d3d5d0c8). You want to text Maya Bennett at +1-415-555-0187 about
  your shopping account after checking your account details. Your state-shopping account is gold tier with 0 loyalty points,
  and your current cart total is 49 for the Harbor Cotton Crew Tee. Make sure cellular service is enabled before sending the
  message.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Maya Chen (customer/account ID user_d3d5d0c8). You want to text Maya Bennett at +1-415-555-0187
      about your shopping account after checking your account details. Your state-shopping account is gold tier with 0 loyalty
      points, and your current cart total is 49 for the Harbor Cotton Crew Tee. Make sure cellular service is enabled before
      sending the message. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: toolsandbox-assistant
    - skill: state-shopping
  agent_response_validations:
  - check: The agent should verify or attempt to enable cellular service on device_0 before trying to send a message to +1-415-555-0187.
  - check: The agent should identify Maya Bennett as the intended contact using person_id 2886d614-b329-4b5b-9bae-aedf8a1fff0d
      and phone number +1-415-555-0187.
  - check: The agent should retrieve and reference Maya Chen's customer account user_d3d5d0c8, including gold tier and 0 loyalty
      points.
  - check: The agent should recognize that sending the message cannot succeed because ts_contacts contains zero entries with
      is_self equal to 1.
  - check: The agent should explain that although the cart contains Harbor Cotton Crew Tee priced at 49, the message step
      is blocked until a self-contact for Maya Chen exists.
  capability_validations:
    expected_capabilities:
    - name: set_cellular_service_status
      description: Toggle cellular service on or off. Raises ValueError if already in the requested state; raises PermissionError
        if low-battery mode is on.
      output:
        check: '{"result": "ValueError because cellular service is already on for device_0"}'
    - name: search_contacts
      description: Search contacts by one or more criteria. name/relationship are fuzzy-matched; person_id/phone_number/is_self
        are exact. Requires at least one criterion.
      output:
        check: '{"result": [{"person_id": "2886d614-b329-4b5b-9bae-aedf8a1fff0d", "name": "Maya Bennett", "phone_number":
          "+1-415-555-0187", "relationship": "friend", "is_self": 0, "created_at": "2026-09-01T10:00:00"}]}'
    - name: get_customer_account
      description: 'Get a customer''s account record: name, email, tier, first-time status, loyalty points, and purchase_history.'
      output:
        check: '{"customer_id": "user_d3d5d0c8", "name": "Maya Chen", "email": "maya.chen@example.com", "tier": "gold", "is_first_time":
          false, "loyalty_points": 0, "purchase_history": []}'
    - name: send_message_with_phone_number
      description: Send a text message to a phone number. Requires cellular ON (ConnectionError otherwise) and exactly one
        self-contact.
      output:
        check: '{"message_id": "Permission error because there is no self-contact with is_self = 1 in ts_contacts"}'
