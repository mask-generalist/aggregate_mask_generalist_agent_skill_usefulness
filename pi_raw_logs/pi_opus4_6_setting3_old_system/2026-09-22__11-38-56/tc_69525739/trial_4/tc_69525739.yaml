id: tc_69525739
description: You are Sofia Martinez (cust_003). You want to look up the company's return policy and save it to a workspace
  file for your records. Your account email is sofia.martinez@example.com, your loyalty tier is standard, and your preferred
  refund method is original_payment. Approve code or command from the agent if prompted
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Sofia Martinez (cust_003). You want to look up the company's  return policy and save it to a workspace
      file for your records. Your account email is sofia.martinez@example.com, your loyalty tier is standard, and your preferred
      refund method is original_payment. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-customer-support
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent must look up the return policy for Sofia Martinez using the topic value return before writing any file.
  - check: The agent must reference that the request is for cust_003 and mention Sofia Martinez in its response or summary.
  - check: The agent must save content derived from the return policy to a file and report that the write succeeded.
  - check: The agent should preserve relevant customer context by noting sofia.martinez@example.com and the standard loyalty
      tier.
  capability_validations:
    expected_capabilities:
    - name: get_policies
      description: Look up the company's policies for a given topic. Must be called before using any write tool (process_return,
        process_refund, cancel_order, process_exchange, process_warranty_claim).
      output:
        check: '{"topic": "return", "rules": "Return policy rules for return."}'
    - name: write
      description: Write content to a file, creating it if it does not exist or overwriting if it does.
      output:
        check: '{"success": true}'
