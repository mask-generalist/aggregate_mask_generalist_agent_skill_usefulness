id: tc_76357953
description: You are Maya Chen (user_d3d5d0c8). You want to check the store's shipping policy, confirm your current cart and
  account details, update your cart's shipping option, and also retrieve the customer-support profile for Sofia Martinez (cust_003).
  Your cart CART-user_d3d5d0c8 currently has the Harbor Cotton Crew Tee priced at 49 with standard shipping costing 6 for
  a total of 55. You also want to verify that your shopping account shows gold tier with 5623 loyalty points and that Sofia
  Martinez's support profile shows her current membership and store credit details.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Maya Chen (user_d3d5d0c8). You want to check the store's shipping policy, confirm your current cart
      and account details, update your cart's shipping option, and also retrieve the customer-support profile for Sofia Martinez
      (cust_003). Your cart CART-user_d3d5d0c8 currently has the Harbor Cotton Crew Tee priced at 49 with standard shipping
      costing 6 for a total of 55. You also want to verify that your shopping account shows gold tier with 5623 loyalty points
      and that Sofia Martinez's support profile shows her current membership and store credit details. Approve code or command
      from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-shopping
    - skill: state-customer-support
  agent_response_validations:
  - check: The agent states that Maya Chen's shopping account user_d3d5d0c8 is gold tier and has 5623 loyalty points.
  - check: The agent reports that cart CART-user_d3d5d0c8 contains 1 unit of Harbor Cotton Crew Tee with product_id PROD-F9994E
      priced at 49.
  - check: The agent confirms that the cart shipping_option is standard with shipping_cost 6 and total 55 after calling set_shipping_option.
  - check: The agent mentions that Sofia Martinez with customer_id cust_003 has membership_tier standard and store_credit_balance
      0 in the customer-support system.
  capability_validations:
    expected_capabilities:
    - name: get_policies
      description: Look up the store's policy for a given topic. Returns a summary and a list of rules.
      output:
        check: '{"topic": "shipping", "summary": "Shipping options affect delivery timing and cart total.", "rules": ["Standard
          shipping is currently applied to CART-user_d3d5d0c8.", "Shipping cost is 6 when the shipping_option is standard.",
          "Calling set_shipping_option again overwrites the prior shipping value."]}'
    - name: set_shipping_option
      description: Write a shipping option to the cart. Adds shipping_cost to cart.total. Calling again overwrites the prior
        value.
      output:
        check: '{"shipping_option": "standard", "shipping_cost": 6, "cart": {"cart_id": "CART-user_d3d5d0c8", "customer_id":
          "user_d3d5d0c8", "items": [{"cart_item_id": "CI-0023", "product_id": "PROD-F9994E", "name": "Harbor Cotton Crew
          Tee", "quantity": 1, "price": 49, "gift_wrap": 0, "variant_id": null}], "subtotal": 49, "discount_amount": 0, "gift_wrap_fee":
          0, "total": 55, "applied_promo_codes": [], "loyalty_points_redeemed": 0, "loyalty_discount": 0, "shipping_option":
          "standard", "shipping_cost": 6}}'
    - name: get_cart
      description: 'Get the customer''s current cart: items with live pricing, subtotal, discount, gift-wrap fee, total, and
        applied promo codes.'
      output:
        check: '{"cart_id": "CART-user_d3d5d0c8", "customer_id": "user_d3d5d0c8", "items": [{"cart_item_id": "CI-0023", "product_id":
          "PROD-F9994E", "name": "Harbor Cotton Crew Tee", "quantity": 1, "price": 49, "gift_wrap": 0, "variant_id": null}],
          "subtotal": 49, "discount_amount": 0, "gift_wrap_fee": 0, "total": 55, "applied_promo_codes": [], "loyalty_points_redeemed":
          0, "loyalty_discount": 0, "shipping_option": "standard", "shipping_cost": 6}'
    - name: get_customer_account
      description: 'Get a customer''s account record: name, email, tier, first-time status, loyalty points, and purchase_history.'
      output:
        check: '{"customer_id": "user_d3d5d0c8", "name": "Maya Chen", "email": "maya.chen@example.com", "tier": "gold", "is_first_time":
          0, "loyalty_points": 5623, "purchase_history": []}'
    - name: get_customer
      description: Retrieve customer profile including membership tier, store credit balance, and preference settings.
      output:
        check: '{"customer_id": "cust_003", "name": "Sofia Martinez", "membership_tier": "standard", "store_credit_balance":
          0, "has_prime_shipping": false, "benefits": []}'
