id: tc_98ab2237
description: 'You are Sofia Martinez (user_id: cust_003). You want to verify your customer profile, search for a product similar
  to the Anker Portable Bluetooth Speaker, save the search results to a file, and then attempt to process a return. You do
  not know your email, so the agent must try a name-and-zip lookup first, then use your state-customer-support account cust_003
  to retrieve your profile. Because there are no orders or order_items in the database for cust_003, the return attempt should
  ultimately fail after the earlier steps are completed. Approve code or command from the agent if prompted'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Sofia Martinez (user_id: cust_003). You want to verify  your customer profile, search for a product
      similar to the Anker Portable Bluetooth Speaker, save the search results to a file, and then attempt to process a return.
      You do not know your email, so the agent must try a name-and-zip lookup first, then use your state-customer-support
      account cust_003 to retrieve your profile. Because there are no orders or order_items in the database for cust_003,
      the return attempt should ultimately fail after the earlier steps are completed. Approve code or command from the agent
      if prompted'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: tau2Retail
    - skill: state-customer-support
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent should attempt tau2Retail lookup for Sofia Martinez using the provided blank zip code and recognize that
      no tau2Retail user_id is found.
  - check: The agent should retrieve the state-customer-support profile for cust_003 and report that Sofia Martinez has membership_tier
      standard and store_credit_balance 0.
  - check: The agent should search for "Anker Portable Bluetooth Speaker" and identify PROD-B98D14 as the top matching product.
  - check: The agent should write a file at cust_003_product_search.txt containing Sofia Martinez, cust_003, and PROD-B98D14.
  - check: The agent should explain that a return cannot be completed for cust_003 because there are no orders or order_items
      in the database, so the process_return attempt for item_id "" fails with refund_amount 0.
  capability_validations:
    expected_capabilities:
    - name: find_user_id_by_name_zip
      description: Locate a user id by first name, last name, and zip code (fallback when email is unknown).
      output:
        check: '{"user_id": ""}'
    - name: get_customer
      description: Retrieve customer profile including membership tier, store credit balance, and preference settings.
      output:
        check: '{"customer_id": "cust_003", "name": "Sofia Martinez", "membership_tier": "standard", "store_credit_balance":
          0, "has_prime_shipping": false, "benefits": []}'
    - name: search_products
      description: Search the task-local product catalog by free-text query. Returns ranked compact matches with product_id,
        name, matched_field, category, subcategory, and in_stock.
      output:
        check: '{"query": "Anker Portable Bluetooth Speaker", "results": [{"product_id": "PROD-B98D14", "name": "Anker Portable
          Bluetooth Speaker", "matched_field": "name", "category": "electronics", "subcategory": "audio", "in_stock": 1}]}'
    - name: write
      description: Write content to a file, creating it if it does not exist or overwriting if it does.
      output:
        check: '{"success": true}'
    - name: process_return
      description: 'Process a return for an order item. Two-step operation: first call without confirm to preview the return
        (eligibility, fees, component breakdown), then call again with confirm=true and amount=<computed net refund> to execute.
        Requires prior call to get_policies(topic=''return'').'
      output:
        check: '{"status": "failed", "item_id": "", "refund_amount": 0, "refund_method": "original_payment", "restocking_fee":
          0, "restocking_discount": 0, "shipping_clawback": 0, "bulk_clawback": 0, "repeat_surcharge": 0, "paid_return_shipping_fee":
          0}'
