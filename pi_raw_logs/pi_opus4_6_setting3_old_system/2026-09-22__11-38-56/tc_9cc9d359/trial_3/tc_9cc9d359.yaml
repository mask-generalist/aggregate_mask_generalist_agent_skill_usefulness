id: tc_9cc9d359
description: You are Maya Chen (customer ID user_d3d5d0c8). You want to review your account and active promotions, confirm
  that PROMO0F1B01 works on your current cart, apply it, and then redeem loyalty points to reduce the total further. Your
  cart CART-user_d3d5d0c8 contains Harbor Cotton Crew Tee (PROD-F9994E) with a subtotal of 49, and you have 5623 loyalty points
  with gold tier status.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Maya Chen (customer ID user_d3d5d0c8). You want to review your account and active promotions, confirm
      that PROMO0F1B01 works on your current cart, apply it, and then redeem loyalty points to reduce the total further. Your
      cart CART-user_d3d5d0c8 contains Harbor Cotton Crew Tee (PROD-F9994E) with a subtotal of 49, and you have 5623 loyalty
      points with gold tier status. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-shopping
  agent_response_validations:
  - check: The agent should identify Maya Chen as customer user_d3d5d0c8 with gold tier status and 5623 loyalty points before
      making discount recommendations.
  - check: The agent should determine that PROMO0F1B01 is valid for cart CART-user_d3d5d0c8 and state the estimated discount
      is 9.8 on the 49 subtotal.
  - check: The agent should apply PROMO0F1B01 to cart CART-user_d3d5d0c8 and report the updated total as 45.2 with applied_promo_codes_json
      containing ["PROMO0F1B01"].
  - check: The agent should redeem 2450 loyalty points for Maya Chen and state that this gives a 24.5 loyalty discount.
  - check: The agent should report the final cart total for CART-user_d3d5d0c8 as 20.7 after applying PROMO0F1B01 and redeeming
      2450 points on the Harbor Cotton Crew Tee (PROD-F9994E).
  capability_validations:
    expected_capabilities:
    - name: get_customer_account
      description: 'Get a customer''s account record: name, email, tier, first-time status, loyalty points, and purchase_history.'
      output:
        check: '{"customer_id": "user_d3d5d0c8", "name": "Maya Chen", "email": "maya.chen@example.com", "tier": "gold", "is_first_time":
          false, "loyalty_points": 5623, "purchase_history": []}'
    - name: get_promotions
      description: List currently active, non-expired promotions. Optional category filter restricts to promos applicable
        to that category.
      output:
        check: '{"promotions": [{"promo_code": "PROMO0F1B01", "description": "Summer sale", "discount_type": "percentage",
          "discount_value": 20, "min_purchase": 0, "max_discount": 50, "category_restriction_json": "[]", "expiry_date": "2027-12-31",
          "active": 1}, {"promo_code": "FALL15SAVE", "description": "Limited-time fall savings: 15% off carts over 75", "discount_type":
          "percentage", "discount_value": 15, "min_purchase": 75, "max_discount": 40, "category_restriction_json": "[]", "expiry_date":
          "2026-10-15", "active": 1}, {"promo_code": "WELCOME10", "description": "Welcome discount: 10% off your first order",
          "discount_type": "percentage", "discount_value": 10, "min_purchase": 0, "max_discount": 30, "category_restriction_json":
          "[]", "expiry_date": "2026-12-31", "active": 1}, {"promo_code": "SAVE20OFF", "description": "$20 off orders over
          $100", "discount_type": "fixed", "discount_value": 20, "min_purchase": 100, "max_discount": 20, "category_restriction_json":
          "[]", "expiry_date": "2026-09-30", "active": 1}]}'
    - name: validate_promo
      description: Check whether a promo code would validate against the customer's current cart. Returns valid, reason, and
        estimated_discount. Checks intrinsic validity only, not customer-fit rules. Pure read, does not mutate cart state.
      output:
        check: '{"valid": true, "reason": "Promo code is valid for the current cart", "estimated_discount": 9.8}'
    - name: apply_promo
      description: Apply a promo code to the cart. Validates the code against cart subtotal, category restriction, and expiry.
        One promo code per cart; applying a different code requires removing the existing one first.
      output:
        check: '{"applied": true, "discount_amount": 9.8, "cart": {"cart_id": "CART-user_d3d5d0c8", "customer_id": "user_d3d5d0c8",
          "subtotal": 49, "discount_amount": 9.8, "gift_wrap_fee": 0, "loyalty_discount": 0, "loyalty_points_redeemed": 0,
          "shipping_option": "standard", "shipping_cost": 6, "total": 45.2, "applied_promo_codes_json": "[\"PROMO0F1B01\"]",
          "item_ids_json": "[\"CI-0023\"]"}}'
    - name: redeem_loyalty_points
      description: 'Redeem the customer''s loyalty points for a dollar discount on the current cart. Rules: 100 points = $1.
        Minimum redemption 500 points. Capped at 50% of cart total.'
      output:
        check: '{"valid": true, "discount_amount": 24.5, "points_debited": 2450, "cart": {"cart_id": "CART-user_d3d5d0c8",
          "customer_id": "user_d3d5d0c8", "subtotal": 49, "discount_amount": 9.8, "gift_wrap_fee": 0, "loyalty_discount":
          24.5, "loyalty_points_redeemed": 2450, "shipping_option": "standard", "shipping_cost": 6, "total": 20.7, "applied_promo_codes_json":
          "[\"PROMO0F1B01\"]", "item_ids_json": "[\"CI-0023\"]"}}'
