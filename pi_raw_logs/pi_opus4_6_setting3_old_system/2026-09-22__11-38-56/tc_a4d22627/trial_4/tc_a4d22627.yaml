id: tc_a4d22627
description: You are Evan Parker (user_fbab7801). You want to check your current location, set standard shipping on cart CART-user_fbab7801,
  review the cart, update one cart item to add gift wrap, and then remove another item before checkout. Your cart currently
  totals 79 with items CI-0010, CI-0011, and CI-0012, and your device location service is on for device_0 at 37.7749, -122.4194.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Evan Parker (user_fbab7801). You want to check your current location, set standard shipping on cart
      CART-user_fbab7801, review the cart, update one cart item to add gift wrap, and then remove another item before checkout.
      Your cart currently totals 79 with items CI-0010, CI-0011, and CI-0012, and your device location service is on for device_0
      at 37.7749, -122.4194. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: toolsandbox-assistant
    - skill: state-shopping
  agent_response_validations:
  - check: The agent checks the current device location and reports the coordinates 37.7749 and -122.4194 before making cart
      changes.
  - check: The agent sets standard shipping for user_fbab7801 on cart CART-user_fbab7801 and confirms the cart total changed
      from 79 to 85 with shipping_cost 6.
  - check: The agent retrieves the cart for user_fbab7801 and references items CI-0010, CI-0011, and CI-0012 with subtotal
      79.
  - check: The agent updates cart item CI-0011 (product PROD-FA349F, Northline Wool Blend Throw Blanket) to add gift wrap
      and confirms the item was modified with gift_wrap_fee 5 and total 90.
  - check: The agent removes product PROD-7583E5, CableCraft USB-C Organizer Strap 2-Pack, and confirms the resulting cart
      subtotal is 63 and total is 74.
  capability_validations:
    expected_capabilities:
    - name: get_current_location
      description: Get the device's current latitude and longitude. Raises PermissionError when location service is OFF.
      output:
        check: '{"latitude": 37.7749, "longitude": -122.4194}'
    - name: set_shipping_option
      description: Write a shipping option to the cart. Adds shipping_cost to cart.total. Calling again overwrites the prior
        value.
      output:
        check: '{"shipping_option": "standard", "shipping_cost": 6, "cart": {"cart_id": "CART-user_fbab7801", "customer_id":
          "user_fbab7801", "subtotal": 79, "discount_amount": 0, "gift_wrap_fee": 0, "total": 85, "applied_promo_codes": [],
          "loyalty_points_redeemed": 0, "loyalty_discount": 0, "shipping_option": "standard", "shipping_cost": 6}}'
    - name: get_cart
      description: 'Get the customer''s current cart: items with live pricing, subtotal, discount, gift-wrap fee, total, and
        applied promo codes.'
      output:
        check: '{"cart_id": "CART-user_fbab7801", "customer_id": "user_fbab7801", "items": [{"cart_item_id": "CI-0010", "product_id":
          "PROD-FA0948", "name": "LogiTech Wireless Mouse M310", "quantity": 1, "gift_wrap": 0, "price": 29}, {"cart_item_id":
          "CI-0011", "product_id": "PROD-FA349F", "name": "Northline Wool Blend Throw Blanket", "quantity": 1, "gift_wrap":
          0, "price": 34}, {"cart_item_id": "CI-0012", "product_id": "PROD-7583E5", "name": "CableCraft USB-C Organizer Strap
          2-Pack", "quantity": 1, "gift_wrap": 0, "price": 16}], "subtotal": 79, "discount_amount": 0, "gift_wrap_fee": 0,
          "total": 85, "applied_promo_codes": [], "loyalty_points_redeemed": 0, "loyalty_discount": 0, "shipping_option":
          "standard", "shipping_cost": 6}'
    - name: update_cart_item
      description: Update an existing cart item's quantity or gift-wrap flag. Setting quantity=0 removes the item from the
        cart.
      output:
        check: '{"cart_item_id": "CI-0011", "cart": {"cart_id": "CART-user_fbab7801", "customer_id": "user_fbab7801", "subtotal":
          79, "discount_amount": 0, "gift_wrap_fee": 5, "total": 90, "applied_promo_codes": [], "loyalty_points_redeemed":
          0, "loyalty_discount": 0, "shipping_option": "standard", "shipping_cost": 6}}'
    - name: remove_from_cart
      description: Remove a product from the customer's cart entirely.
      output:
        check: '{"cart": {"cart_id": "CART-user_fbab7801", "customer_id": "user_fbab7801", "subtotal": 63, "discount_amount":
          0, "gift_wrap_fee": 5, "total": 74, "applied_promo_codes": [], "loyalty_points_redeemed": 0, "loyalty_discount":
          0, "shipping_option": "standard", "shipping_cost": 6}}'
