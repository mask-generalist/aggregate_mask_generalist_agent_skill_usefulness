id: tc_da66b98d
description: You are Maya Chen (user_d3d5d0c8). You want to look up your retail account details and then save yourself as
  a new contact on your device. Your account email is maya.chen@example.com, and your retail history includes orders like
  ORD-5B048F and ORD-CCC96C. You also want the agent to use the retrieved profile details, including your payment method cc_6abb1fab,
  before adding the contact. Approve code or command from the agent if prompted
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Maya Chen (user_d3d5d0c8). You want to look up your retail  account details and then save yourself
      as a new contact on your device. Your account email is maya.chen@example.com, and your retail history includes orders
      like ORD-5B048F and ORD-CCC96C. You also want the agent to use the retrieved profile details, including your payment
      method cc_6abb1fab, before adding the contact. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: tau2Retail
    - skill: toolsandbox-assistant
  agent_response_validations:
  - check: The agent retrieves the retail profile for user_d3d5d0c8 and identifies the user as Maya Chen.
  - check: The agent mentions that maya.chen@example.com is the email returned from the retail account lookup.
  - check: The agent confirms the retrieved payment method cc_6abb1fab is a mastercard ending in 4431.
  - check: The agent references at least one real order ID from the profile lookup, such as ORD-5B048F or ORD-CCC96C, before
      adding the contact.
  - check: The agent adds a new self-contact for Maya Chen and reports that a new person_id was created rather than reusing
      an existing contact like 2886d614-b329-4b5b-9bae-aedf8a1fff0d.
  capability_validations:
    expected_capabilities:
    - name: get_user_details
      description: Fetch user profile, payment methods, and order ids.
      output:
        check: '{"user_id": "user_d3d5d0c8", "name": "Maya Chen", "address": {}, "email": "maya.chen@example.com", "payment_methods":
          {"cc_6abb1fab": {"source": "credit_card", "id": "cc_6abb1fab", "brand": "mastercard", "last_four": "4431"}}, "orders":
          ["ORD-6C71B1", "ORD-5B048F", "ORD-12AAA3", "ORD-542FDA", "ORD-D7E869", "ORD-C31654", "ORD-CCC96C"]}'
    - name: add_contact
      description: Add a new contact to the database. Raises DuplicateError if adding a second self-contact.
      output:
        check: '{"person_id": "newly generated person ID"}'
