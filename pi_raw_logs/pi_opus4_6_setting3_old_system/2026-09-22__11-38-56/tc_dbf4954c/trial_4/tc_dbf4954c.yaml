  - check: The agent tells Evan Parker that after removing CI-0011, the cart subtotal changes from 79 to 45.
  - check: The agent checks shipping options for CART-user_fbab7801 and mentions that standard costs 6 while express costs
      12.
  - check: The agent retrieves the shipping policy and references that Evan Parker is standard tier with has_prime_shipping
      0.
  - check: The agent sets the cart shipping option to express and confirms the final total for CART-user_fbab7801 is 57.
  capability_validations:
    expected_capabilities:
    - name: remove_from_cart
      description: Remove a product from the customer's cart entirely.
      output:
        check: '{"cart": {"cart_id": "CART-user_fbab7801", "customer_id": "user_fbab7801", "items": [{"cart_item_id": "CI-0010",
          "product_id": "PROD-FA0948", "name": "LogiTech Wireless Mouse M310", "quantity": 1, "gift_wrap": 0, "variant_id":
