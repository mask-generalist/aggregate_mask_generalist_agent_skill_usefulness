          0, "gift_wrap_fee": 0, "total": 51, "applied_promo_codes": [], "loyalty_points_redeemed": 0, "loyalty_discount":
          0, "shipping_option": "standard", "shipping_cost": 6}}'
    - name: get_shipping_options
      description: List shipping options available for the customer's cart. Returns each option's cost, ETA, and tier-eligibility
        note. Use only when the customer explicitly asks about shipping.
      output:
        check: '{"options": [{"shipping_option": "standard", "cost": 6, "eta": "5-7 business days", "tier_eligibility_note":
          "available for standard"}, {"shipping_option": "express", "cost": 12, "eta": "2-3 business days", "tier_eligibility_note":
          "available for standard"}]}'
    - name: get_policies
      description: Look up the store's policy for a given topic. Returns a summary and a list of rules.
      output:
        check: '{"topic": "shipping", "summary": "Shipping costs and delivery speed depend on the selected shipping option
