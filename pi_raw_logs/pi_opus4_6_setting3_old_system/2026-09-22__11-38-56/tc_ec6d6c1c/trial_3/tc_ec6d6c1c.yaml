  command from the agent if prompted'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Jordan Kim (person_id: 0d962e01-b007-4e86-88c1-cf6b43282b3e).  You want to turn off low-battery
      mode, turn cellular service back on, search your contacts for Ramirez, and save the matching contact details to a file.
      Your device setup context is device_0, and the Ramirez matches in your contacts are Sofia Ramirez and Elena Ramirez.
      Approve code or command from the agent if prompted'
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: toolsandbox-assistant
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent disables low-battery mode before attempting to enable cellular service on device_0.
  - check: The agent enables cellular service only after low-battery mode is turned off, avoiding the low_battery_mode=1 restriction
      described for device_0.
  - check: The agent searches contacts using the name Ramirez and identifies both Sofia Ramirez (a2f34471-50af-42dd-b614-bbb9aff787b7)
      and Elena Ramirez (fe958077-a86a-4a32-b368-3fb4bb5d4ba4).
  - check: The agent writes a file containing the matching Ramirez contacts, including phone numbers +1-917-555-0148 and +1-312-555-0148.
  capability_validations:
    expected_capabilities:
    - name: set_low_battery_mode_status
      description: Toggle low-battery mode on or off. Enabling cascades wifi/cellular/location OFF. Raises ValueError if already
        in the requested state.
      output:
        check: '{"result": "Low-battery mode disabled on device_0."}'
    - name: set_cellular_service_status
      description: Toggle cellular service on or off. Raises ValueError if already in the requested state; raises PermissionError
        if low-battery mode is on.
      output:
        check: '{"result": "Cellular service enabled on device_0."}'
    - name: search_contacts
      description: Search contacts by one or more criteria. name/relationship are fuzzy-matched; person_id/phone_number/is_self
        are exact. Requires at least one criterion.
      output:
        check: '{"result": [{"person_id": "a2f34471-50af-42dd-b614-bbb9aff787b7", "name": "Sofia Ramirez", "phone_number":
          "+1-917-555-0148", "relationship": "friend", "is_self": 0, "created_at": "2026-09-01T10:00:00"}, {"person_id": "fe958077-a86a-4a32-b368-3fb4bb5d4ba4",
          "name": "Elena Ramirez", "phone_number": "+1-312-555-0148", "relationship": "friend", "is_self": 0, "created_at":
          "2026-09-01T10:00:00"}]}'
    - name: write
      description: Write content to a file, creating it if it does not exist or overwriting if it does.
      output:
        check: '{"success": true}'
