id: tc_ec6d6c1c
description: 'You are Jordan Kim (person_id: 0d962e01-b007-4e86-88c1-cf6b43282b3e). You want to turn off low-battery mode,
  turn cellular service back on, search your contacts for Ramirez, and save the matching contact details to a file. Your device
