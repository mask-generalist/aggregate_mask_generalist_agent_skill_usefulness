id: tc_12a0cc45
description: You are alice (alice@example.com). You want to find the Excel order file
  in the data directory, read it, generate a short summary of the cancelled and confirmed
  orders for Maya Chen on 2026-09-02, and email that summary to bob@example.com. The
  spreadsheet data includes orders such as ORD-6C71B1, ORD-5B048F, ORD-12AAA3, and
  ORD-542FDA with totals 79.0, 108.0, 39.0, and 68.0.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are alice (alice@example.com). You want to find the Excel order
      file in the data directory, read it, generate a short summary of the cancelled
      and confirmed orders for Maya Chen on 2026-09-02, and email that summary to
      bob@example.com. The spreadsheet data includes orders such as ORD-6C71B1, ORD-5B048F,
      ORD-12AAA3, and ORD-542FDA with totals 79.0, 108.0, 39.0, and 68.0.
      Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent lists Excel files and identifies data/order_summary.xlsx before
      attempting to read it.
  - check: The agent reads data/order_summary.xlsx and extracts the Maya Chen orders
      ORD-6C71B1, ORD-5B048F, ORD-12AAA3, and ORD-542FDA dated 2026-09-02.
  - check: The agent's generated summary distinguishes cancelled orders ORD-6C71B1
      and ORD-12AAA3 from confirmed orders ORD-5B048F and ORD-542FDA, including totals
      79.0, 39.0, 108.0, and 68.0.
  - check: The agent sends an email from alice@example.com to bob@example.com containing
      the summary of Maya Chen's orders from data/order_summary.xlsx.
  capability_validations:
    expected_capabilities:
    - name: list_files
      description: List files in a directory, optionally filtered by glob pattern.
      output:
        check: '{"files": ["data/order_summary.xlsx"]}'
    - name: read_file
      description: 'Read all cell values from an Excel file, returning (row, col):
        value pairs.'
      output:
        check: '{"cells": {"Orders:R1C1": "Order ID", "Orders:R1C2": "Customer", "Orders:R1C3":
          "Date", "Orders:R1C4": "Status", "Orders:R1C5": "Items", "Orders:R1C6":
          "Total Paid", "Orders:R2C1": "ORD-6C71B1", "Orders:R2C2": "Maya Chen", "Orders:R2C3":
          "2026-09-02", "Orders:R2C4": "cancelled", "Orders:R2C5": "Anker Portable
          Bluetooth Speaker", "Orders:R2C6": "79.0", "Orders:R3C1": "ORD-5B048F",
          "Orders:R3C2": "Maya Chen", "Orders:R3C3": "2026-09-02", "Orders:R3C4":
          "confirmed", "Orders:R3C5": "Anker Portable Bluetooth Speaker, LogiTech
          Wireless Mouse M310", "Orders:R3C6": "108.0", "Orders:R4C1": "ORD-12AAA3",
          "Orders:R4C2": "Maya Chen", "Orders:R4C3": "2026-09-02", "Orders:R4C4":
          "cancelled", "Orders:R4C5": "Wireless Ergonomic Mouse", "Orders:R4C6": "39.0",
          "Orders:R5C1": "ORD-542FDA", "Orders:R5C2": "Maya Chen", "Orders:R5C3":
          "2026-09-02", "Orders:R5C4": "confirmed", "Orders:R5C5": "OXO SoftWorks
          3-Piece Mixing Bowl Set, ThermoPro Digital Meat Thermometer", "Orders:R5C6":
          "68.0"}}'
    - name: complete_text
      description: Send a prompt to the configured LLM and return the response.
      output:
        check: '{"response": "On 2026-09-02, Maya Chen has four orders in data/order_summary.xlsx.
          Cancelled orders are ORD-6C71B1 for 79.0 containing Anker Portable Bluetooth
          Speaker and ORD-12AAA3 for 39.0 containing Wireless Ergonomic Mouse. Confirmed
          orders are ORD-5B048F for 108.0 containing Anker Portable Bluetooth Speaker
          and LogiTech Wireless Mouse M310, and ORD-542FDA for 68.0 containing OXO
          SoftWorks 3-Piece Mixing Bowl Set and ThermoPro Digital Meat Thermometer."}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "sent"}'
