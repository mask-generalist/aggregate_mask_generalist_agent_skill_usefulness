id: tc_c0d765ce
description: You are Rachel Kim (E001), VP of Sales at Meridian Analytics. You want to read the current Q3 2026 business report
  and then overwrite it with an updated note that highlights James Okafor's won deals from data/sales_q3.csv. The existing
  report says Q3 2026 generated $1,040,000 in new contract value and was prepared by Rachel Kim and Claire Fontaine, so you
  want the agent to preserve that context while adding James Okafor's deal details.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Rachel Kim (E001), VP of Sales at Meridian Analytics. You want to read the current Q3 2026 business
      report and then overwrite it with an updated note that highlights James Okafor's won deals from data/sales_q3.csv. The
      existing report says Q3 2026 generated $1,040,000 in new contract value and was prepared by Rachel Kim and Claire Fontaine,
      so you want the agent to preserve that context while adding James Okafor's deal details. Approve code or command from
      the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
  agent_response_validations:
  - check: The agent reads docs/q3_report.md and identifies that it is the Q3 2026 Business Report prepared by Rachel Kim
      and Claire Fontaine.
  - check: The agent writes updated content to docs/q3_report.md rather than a different file path.
  - check: The agent's written content preserves the existing executive summary stating $1,040,000 in new contract value.
  - check: The agent adds James Okafor's won deal details including D001 for 87500, D003 for 43000, and D006 for 120000.
  capability_validations:
    expected_capabilities:
    - name: read_file
      description: Read file contents from workspace, optionally filtering by line range or regex pattern.
      output:
        check: '{"content": "# Meridian Analytics \u2014 Q3 2026 Business Report\n\n**Period:** July 1 \u2013 September 7,
          2026\n**Prepared by:** Rachel Kim, VP of Sales | Claire Fontaine, CFO\n\n## Executive Summary\n\nQ3 2026 marks another
          strong quarter for Meridian Analytics. Across our 15-person team we closed 14 deals out of 22 opportunities, generating
          **$1,040,000** in new contract value."}'
    - name: write_file
      description: Write content to a file, creating it if it does not exist or overwriting if it does.
      output:
        check: '{"success": true}'
