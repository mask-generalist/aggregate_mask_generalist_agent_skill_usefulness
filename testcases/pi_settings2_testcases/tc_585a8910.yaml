id: tc_585a8910
description: You are Olivia HR Manager (olivia.hr.manager, olivia.hr.manager@company.com).
  You want to find the travel summary Word document, read its contents, append a short
  note about the existing Maya Chen travel records, convert the updated document to
  PDF, and email it to Ethan IT Specialist at ethan.it.specialist@company.com. The
  document includes Booking C4C633, Reservation HR-7D93, and Rental CR-BE00 for Maya
  Chen in Seattle-related travel details.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Olivia HR Manager (olivia.hr.manager, olivia.hr.manager@company.com).
      You want to find the travel summary Word document, read its contents, append
      a short note about the existing Maya Chen travel records, convert the updated
      document to PDF, and email it to Ethan IT Specialist at ethan.it.specialist@company.com.
      The document includes Booking C4C633, Reservation HR-7D93, and Rental CR-BE00
      for Maya Chen in Seattle-related travel details.
      Approve code or command from the agent if prompted.
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: skill0_artifacts
    - skill: OfficeBench
  agent_response_validations:
  - check: The agent finds docs/travel_summary.docx by searching the docs directory
      for *.docx files.
  - check: The agent reads and uses the content showing Booking C4C633, Reservation
      HR-7D93, and Rental CR-BE00 for Maya Chen.
  - check: The agent appends a note to docs/travel_summary.docx that references the
      amounts $70.00, $338.00, and $162.00.
  - check: The agent converts docs/travel_summary.docx into a PDF before sending the
      email.
  - check: 'The agent emails ethan.it.specialist@company.com from olivia.hr.manager@company.com
      with subject High Priority: Onboarding Equipment Setup Needed and mentions Maya
      Chen.'
  capability_validations:
    expected_capabilities:
    - name: bash
      description: Search workspace for files matching a glob pattern within a directory.
      output:
        check: '{"files": ["docs/customer_report.docx", "docs/travel_summary.docx"]}'
    - name: word_read_file
      description: Read paragraph text from a Word document.
      output:
        check: '{"text": "Travel Booking Summary\nFlights\nBooking 00C256 | Maya Chen
          | LAX → SFO | economy | cancelled | $0.00\nBooking C4C633 | Maya Chen |
          SEA → SEA | economy | confirmed | $70.00\nHotels\nReservation HR-7D93 |
          Maya Chen | Maple Street Suites, Seattle | 2026-09-16 – 2026-09-18 | Standard
          Queen | cancelled | $338.00\nCar Rentals\nRental CR-BE00 | Maya Chen | Hertz
          Compact | Seattle-Tacoma International Airport → Seattle-Tacoma International
          Airport | 2026-09-12 – 2026-09-15 | confirmed | $162.00"}'
    - name: write_to_file
      description: Append text to a Word document with optional style.
      output:
        check: '{"status": "Appended text to docs/travel_summary.docx"}'
    - name: word_convert_to_pdf
      description: Convert a Word document to PDF.
      output:
        check: '{"status": "Converted docs/travel_summary.docx to PDF"}'
    - name: send_email
      description: Send an email, saved to both sender and recipient inboxes.
      output:
        check: '{"status": "Email sent from olivia.hr.manager@company.com to ethan.it.specialist@company.com"}'
