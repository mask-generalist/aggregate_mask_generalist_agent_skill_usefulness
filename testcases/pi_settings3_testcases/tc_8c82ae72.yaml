test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: You are Caleb Foster (user_58b0a2d6). You want to update your cart by changing the quantity on RidgeLine
      Fleece Zip Hoodie, remove the out-of-stock Harbor Cotton Crew Tee, check shipping options, review the shipping policy,
