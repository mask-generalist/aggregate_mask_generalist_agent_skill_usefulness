      currently shows standard shipping with shipping_cost 0 and total 460. Approve code or command from the agent if prompted
  max_turns: 35
  skill_validations:
    expected_skill_invocations:
    - skill: state-shopping
  agent_response_validations:
  - check: The agent updates cart item CI-0006 for RidgeLine Fleece Zip Hoodie from quantity 3 to quantity 2.
  - check: The agent removes the out-of-stock Harbor Cotton Crew Tee with product ID PROD-F9994E from cart CART-user_58b0a2d6.
  - check: The agent checks shipping options only after the user explicitly asks about shipping for cart CART-user_58b0a2d6.
  - check: The agent retrieves the shipping policy using the topic shipping before applying the final shipping selection.
  - check: The agent applies the standard shipping option and confirms the cart total is 322 for user_58b0a2d6.
  capability_validations:
    expected_capabilities:
    - name: update_cart_item
      description: Update an existing cart item's quantity or gift-wrap flag. Setting quantity=0 removes the item from the
        cart.
      output:
        check: '{"cart_item_id": "CI-0006", "cart": {"cart_id": "CART-user_58b0a2d6", "customer_id": "user_58b0a2d6", "subtotal":
          371, "discount_amount": 0, "gift_wrap_fee": 0, "loyalty_discount": 0, "loyalty_points_redeemed": 0, "shipping_option":
          "standard", "shipping_cost": 0, "total": 371, "applied_promo_codes_json": "[]", "item_ids_json": "[\"CI-0005\",
          \"CI-0006\", \"CI-0007\"]"}}'
    - name: remove_from_cart
      description: Remove a product from the customer's cart entirely.
      output:
        check: '{"cart": {"cart_id": "CART-user_58b0a2d6", "customer_id": "user_58b0a2d6", "subtotal": 322, "discount_amount":
          0, "gift_wrap_fee": 0, "loyalty_discount": 0, "loyalty_points_redeemed": 0, "shipping_option": "standard", "shipping_cost":
          0, "total": 322, "applied_promo_codes_json": "[]", "item_ids_json": "[\"CI-0006\", \"CI-0007\"]"}}'
    - name: get_shipping_options
      description: List shipping options available for the customer's cart. Returns each option's cost, ETA, and tier-eligibility
        note. Use only when the customer explicitly asks about shipping.
      output:
        check: '{"options": [{"option": "standard", "cost": 0, "eta": "standard", "tier_eligibility_note": "standard"}]}'
    - name: get_policies
      description: Look up the store's policy for a given topic. Returns a summary and a list of rules.
      output:
        check: '{"topic": "shipping", "summary": "shipping", "rules": ["standard"]}'
    - name: set_shipping_option
      description: Write a shipping option to the cart. Adds shipping_cost to cart.total. Calling again overwrites the prior
        value.
      output:
        check: '{"shipping_option": "standard", "shipping_cost": 0, "cart": {"cart_id": "CART-user_58b0a2d6", "customer_id":
          "user_58b0a2d6", "subtotal": 322, "discount_amount": 0, "gift_wrap_fee": 0, "loyalty_discount": 0, "loyalty_points_redeemed":
          0, "shipping_option": "standard", "shipping_cost": 0, "total": 322, "applied_promo_codes_json": "[]", "item_ids_json":
          "[\"CI-0006\", \"CI-0007\"]"}}'
